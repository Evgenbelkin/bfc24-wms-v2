<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Заявки на поставку — Кабинет клиента</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .qty-row{display:flex;align-items:center;gap:10px;}
    .qty-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:20px;font-weight:700;cursor:pointer;}
    .qty-val{flex:0 0 64px;text-align:center;font-size:20px;font-weight:800;color:var(--green2);border:2px solid var(--border);border-radius:10px;background:var(--card2);padding:4px;-moz-appearance:textfield;font-family:inherit;}
    .qty-val::-webkit-outer-spin-button,.qty-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
    .qty-val:focus{outline:none;border-color:var(--accent);}
    .btn-remove{background:var(--red2);color:var(--red2-text);border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;}
    .suggest-list{margin-top:8px;max-height:220px;overflow-y:auto;}
    .suggest-row{cursor:pointer;}
    .order-row{cursor:pointer;}
    .order-row:active{opacity:.7;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/seller/menu.html" class="btn-sm btn-back" id="header-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><rect x="1" y="7" width="14" height="10" rx="1"/><path d="M15 10h5l3 4v3h-8z"/><circle cx="6" cy="19" r="1.8"/><circle cx="18" cy="19" r="1.8"/></svg> Заявки на поставку</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <!-- ============ LIST ============ -->
  <div id="list-view">
    <button class="btn-big btn-green btn-full" onclick="openCreateForm()"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Новая заявка</button>
    <div class="card" style="margin-top:12px;">
      <div id="orders-list"></div>
    </div>
    <button class="btn-sm btn-back" onclick="loadOrders()">↻ Обновить</button>
  </div>

  <!-- ============ DETAIL ============ -->
  <div id="detail-view" style="display:none">
    <button class="btn-sm btn-back" onclick="backToList()" style="margin-bottom:12px;">← К списку</button>
    <div class="card">
      <div class="card-title">Заявка <span id="d-number"></span></div>
      <div class="badge-row">
        <div class="badge"><span>Статус</span><div id="d-status">—</div></div>
        <div class="badge"><span>Ожидается</span><div id="d-expected">—</div></div>
        <div class="badge"><span>Всего единиц</span><div id="d-total">0</div></div>
      </div>
      <div id="d-notes" class="refresh-note" style="text-align:left;margin-top:10px;"></div>
      <div id="d-delivery-info" class="refresh-note" style="text-align:left;margin-top:6px;display:none;"></div>
    </div>
    <div class="card">
      <div class="card-title">Состав</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Товар</th><th>Штрихкод</th><th>Ожидается</th><th>Принято</th><th>Статус</th></tr></thead>
          <tbody id="detail-lines-body"></tbody>
        </table>
      </div>
    </div>
    <button class="btn-big btn-green btn-full" id="confirm-btn" style="display:none" onclick="confirmOrder()"><svg class="i" viewBox="0 0 24 24"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14.01l-3-3"/></svg> Подтвердить заявку (отправить складу)</button>
  </div>

  <!-- ============ CREATE ============ -->
  <div id="create-view" style="display:none">
    <button class="btn-sm btn-back" onclick="backToList()" style="margin-bottom:12px;">← Отмена</button>

    <div class="card">
      <div class="field-row" style="display:flex;gap:10px;flex-wrap:wrap;">
        <div class="field" style="flex:1;min-width:160px;"><label>Ожидаемая дата</label><input id="c-expected-date" type="date"/></div>
      </div>
      <div class="field-row" style="display:flex;gap:10px;flex-wrap:wrap;">
        <div class="field" style="flex:1;min-width:160px;"><label>ФИО водителя</label><input id="c-driver-name" placeholder="Необязательно, если уже известен"/></div>
        <div class="field" style="flex:1;min-width:160px;"><label>Марка машины / гос. номер</label><input id="c-vehicle-make" placeholder="Необязательно"/></div>
      </div>
      <div class="field"><label>Комментарий</label><textarea id="c-notes" rows="2" placeholder="Необязательно"></textarea></div>
    </div>

    <div class="card">
      <div class="card-title">Добавить товар</div>
      <div class="field" style="margin-bottom:0;">
        <label>Поиск по вашему каталогу</label>
        <input id="search-item" placeholder="Начните вводить название или штрихкод..." autocomplete="off"/>
      </div>
      <div id="suggest-list" class="suggest-list"></div>

      <div class="scan-row" style="margin-top:12px;">
        <input id="add-barcode" class="scan-input" placeholder="Или введите штрихкод вручную" autocomplete="off"/>
      </div>
      <div id="add-item-name" class="refresh-note" style="text-align:left;"></div>
      <div class="qty-row" style="margin-top:12px;">
        <button class="qty-btn" onclick="stepAddQty(-1)">−</button>
        <input type="number" class="qty-val" id="add-qty-val" value="1" min="1" step="1" inputmode="numeric" onchange="setAddQty(this.value)" onfocus="this.select()"/>
        <button class="qty-btn" onclick="stepAddQty(1)">+</button>
        <button class="btn-big btn-blue" style="flex:1;" onclick="addLine()"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Добавить</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Строки заявки (<span id="lines-count">0</span>)</div>
      <div id="lines-list"></div>
    </div>

    <button class="btn-big btn-green btn-full" onclick="submitOrder()"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg> Создать заявку</button>
  </div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
