<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Приёмка ФБС по складам — BFC24 WMS</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);}
    th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;}
    tbody tr:hover{background:var(--card2);}
    .refresh-note{font-size:12px;color:var(--muted);}
    .pill-free{background:var(--green2,#2e9e5b);color:#fff;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;}
    .pill-paid{background:var(--amber,#b8860b);color:#fff;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;}
    .pill-closed{background:var(--red,#c0392b);color:#fff;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;}
    .pill-unknown{background:var(--card2);color:var(--muted);padding:3px 8px;border-radius:8px;font-size:12px;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 12h4l1.5 3h7L17 12h4"/><path d="M12 3v6M9 6l3 3 3-3"/></svg> Приёмка ФБС по складам</h1>
    <span></span>
  </div>

    <div class="refresh-note" style="margin-bottom:10px;" id="meta">—</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Склад</th>
            <th>Сегодня</th>
            <th>Ближайшая бесплатная дата</th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="3" style="text-align:center;">Загрузка…</td></tr></tbody>
      </table>
    </div>
  </div>
