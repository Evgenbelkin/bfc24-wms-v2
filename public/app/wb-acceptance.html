<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Приёмка ФБС по складам — BFC24 WMS</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);}
    th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;}
    tbody tr:hover{background:var(--card2);}
    .refresh-note{font-size:12px;color:var(--muted);}
    .pill-free{background:var(--green2,#2e9e5b);color:#fff;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;}
    .pill-paid{background:var(--amber,#b8860b);color:#fff;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;}
    .pill-closed{background:var(--red,#c0392b);color:#fff;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;}
    .pill-unknown{background:var(--card2);color:var(--muted);padding:3px 8px;border-radius:8px;font-size:12px;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 12h4l1.5 3h7L17 12h4"/><path d="M12 3v6M9 6l3 3 3-3"/></svg> Приёмка ФБС по складам</h1>
    <span></span>
  </div>

  <div class="card">
    <div class="card-title">Коэффициент приёмки — где сейчас бесплатно</div>
    <div class="refresh-note" style="margin-bottom:10px;" id="meta">—</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Склад</th>
            <th>Сегодня</th>
            <th>Ближайшая бесплатная дата</th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="3" style="text-align:center;">Загрузка…</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
  <script>
    if (!UI.requireAuth()) throw new Error('Not logged in');

    function todayPill(coef, allowUnload) {
      if (coef === null || coef === undefined) return '<span class="pill-unknown">нет данных</span>';
      if (coef < 0 || allowUnload === false) return '<span class="pill-closed">закрыт</span>';
      if (coef === 0) return '<span class="pill-free">бесплатно</span>';
      return `<span class="pill-paid">платно ×${coef}</span>`;
    }

    function freeDateText(w) {
      if (!w.nearest_free_date) return '— нет в ближайшие 14 дней';
      if (w.days_until_free === 0) return 'сегодня';
      const d = new Date(w.nearest_free_date);
      const dateStr = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
      return `${dateStr} (через ${w.days_until_free} дн.)`;
    }

    async function load() {
      try {
        const res = await window.API.wb.acceptanceCoefficients();
        const list = res.warehouses || [];
        const meta = document.getElementById('meta');
        if (!list.length) {
          meta.textContent = 'Данных пока нет — обновляются автоматически (раз в час).';
          document.getElementById('tbody').innerHTML = '<tr><td colspan="3" style="text-align:center;">Нет данных</td></tr>';
          return;
        }
        meta.textContent = res.fetched_at
          ? `Обновлено: ${new Date(res.fetched_at).toLocaleString('ru-RU')}. Складов: ${list.length}.`
          : `Складов: ${list.length}.`;

        document.getElementById('tbody').innerHTML = list.map(w => `
          <tr>
            <td>${UI.escHtml(w.warehouse_name || '')}</td>
            <td>${todayPill(w.today_coefficient, w.today_allow_unload)}</td>
            <td>${UI.escHtml(freeDateText(w))}</td>
          </tr>
        `).join('');
      } catch (e) {
        UI.toast(e.message || 'Ошибка загрузки', 'error');
      }
    }

    load();
  </script>
</body>
</html>
