<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>QR для отметки на складе — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .kiosk-wrap{max-width:480px;margin:40px auto;text-align:center;}
    .kiosk-qr{background:#fff;border-radius:20px;padding:24px;display:inline-block;box-shadow:0 10px 30px rgba(0,0,0,0.25);}
    .kiosk-qr svg{width:min(70vw,340px);height:min(70vw,340px);display:block;}
    .kiosk-title{font-size:22px;font-weight:800;margin:24px 0 6px;}
    .kiosk-sub{color:var(--muted);font-size:14px;margin-bottom:20px;}
    .kiosk-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;max-width:260px;margin:0 auto;}
    .kiosk-bar-fill{height:100%;background:var(--accent);width:100%;transition:width 1s linear;}
    .kiosk-note{margin-top:28px;font-size:12px;color:var(--muted);}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg> QR для отметки на складе</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div class="kiosk-wrap">
    <div class="kiosk-title">Отсканируйте, чтобы начать смену</div>
    <div class="kiosk-sub">Каждый сотрудник сканирует этот код своим телефоном в приложении BFC24 (раздел «Отметка на складе»)</div>
    <div class="kiosk-qr" id="qr-box">
      <div style="width:280px;height:280px;display:flex;align-items:center;justify-content:center;color:#999;">Загрузка...</div>
    </div>
    <div class="kiosk-bar" style="margin-top:20px;"><div class="kiosk-bar-fill" id="bar-fill"></div></div>
    <div class="kiosk-note">Код меняется каждые 90 секунд — так и должно быть, ничего не сломалось</div>
  </div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>

</body>
</html>
