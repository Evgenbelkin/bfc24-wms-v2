<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Отгрузка — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .ship-row{cursor:pointer;}
    .ship-row:active{opacity:.7;}
    .qr-box{text-align:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px;}
    .qr-box img{max-width:220px;width:100%;}
    .filters-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;}
    .filters-row input[type=date]{flex:1;min-width:130px;padding:10px 12px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;}
    .filters-row label{font-size:11px;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1>🚚 Отгрузка</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div id="list-view">
    <div class="tabs">
      <button class="tab active" data-status="ready_to_ship" onclick="switchStatus('ready_to_ship')">Готовы</button>
      <button class="tab" data-status="in_transit" onclick="switchStatus('in_transit')">Отгружены</button>
      <button class="tab" data-status="" onclick="switchStatus('')">Все</button>
    </div>
    <!-- Фильтр по дате факта отгрузки (когда реально уехало), не по дате
         создания заказа — чтобы можно было спросить "что отгрузили такого-то
         числа" и увидеть, кто именно это отгрузил. -->
    <div class="filters-row">
      <label>Отгружено с</label>
      <input type="date" id="f-shipped-from"/>
      <label>по</label>
      <input type="date" id="f-shipped-to"/>
      <button class="btn-sm btn-back" onclick="applyDateFilter()">🔍 Показать</button>
      <button class="btn-sm btn-back" onclick="resetDateFilter()">✕ Сброс</button>
    </div>
    <div id="ship-list"></div>
    <button class="btn-sm btn-back" onclick="loadBoard()">↻ Обновить</button>
  </div>

  <div id="detail-view" style="display:none">
    <button class="btn-sm btn-back" onclick="backToList()" style="margin-bottom:12px;">← К списку</button>

    <div class="card">
      <div class="card-title">Отгрузка <span id="d-code"></span></div>
      <div class="badge-row">
        <div class="badge"><span>Статус</span><div id="d-status">—</div></div>
        <div class="badge"><span>Клиент</span><div id="d-client">—</div></div>
        <div class="badge"><span>Собрано</span><div id="d-picked">0/0</div></div>
        <div class="badge" id="d-shipped-badge" style="display:none"><span>Отгружено</span><div id="d-shipped">—</div></div>
      </div>
    </div>

    <div class="card" id="confirm-card">
      <div class="card-title">Подтверждение отгрузки</div>
      <div class="refresh-note" id="confirm-hint" style="margin-bottom:8px;">Отсканируйте QR/штрихкод поставки (со стикера коробки/акта передачи)</div>
      <div class="scan-row">
        <input id="scan-code" class="scan-input" placeholder="Код поставки" inputmode="none" autocomplete="off"/>
        <button type="button" class="scan-camera-btn" onclick="UI.scanInto('#scan-code','Скан кода поставки')">📷</button>
      </div>
      <div id="confirm-status" class="refresh-note"></div>
      <div id="qr-result" style="display:none"></div>
    </div>

    <!-- Постоянный блок QR поставки WB — виден в любой момент, если QR уже получен
         (не только сразу после подтверждения отгрузки), чтобы можно было открыть/
         перепечатать позже, например если стикер зажевало принтером. -->
    <div class="card" id="wb-qr-card" style="display:none">
      <div class="card-title">QR поставки WB</div>
      <div class="qr-box" id="wb-qr-box"></div>
      <div class="scan-row" style="margin-top:10px;">
        <button type="button" class="btn-sm btn-back" onclick="openWbQr()">Открыть QR</button>
        <button type="button" class="btn-sm btn-back" onclick="printWbQr()">Печать QR</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Состав</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Товар</th><th>План</th><th>Собрано</th><th>Упаковано</th><th>Фото</th><th>Стикер</th><th>Действие</th></tr></thead>
          <tbody id="lines-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/shared/scanner.js"></script>
  <script>
    if (!UI.requireAuth()) throw new Error('Not logged in');
    if (!UI.requireRole(['shipper','packer','picker','supervisor','tenant_admin'])) {
      window.location.href = '/app/menu.html';
    }

    async function logout() { await window.API.auth.logout(); window.location.href = '/app/login.html'; }

    // "Вернуть в сборку" прямо из состава отгрузки — сборщику помогли найти
    // пропущенный товар, и не нужно отдельно идти в Диспетчерскую искать его
    // там: кнопка сразу на той же строке. Бэкенд всё равно требует
    // supervisor/tenant_admin (см. POST /picking/tasks/:id/requeue), но прячем
    // кнопку и на фронте, чтобы сборщик/упаковщик/отгрузчик её даже не видели.
    const _cu = window.API.getUser();
    const _cuRoles = (_cu && _cu.roles && _cu.roles.length) ? _cu.roles : [_cu?.role];
    const canRequeue = _cuRoles.includes('tenant_admin') || _cuRoles.includes('supervisor');

    let currentStatus = 'ready_to_ship';
    let shipments = [];
    let currentShipment = null;
    let currentLines = [];

    function switchStatus(status) {
      currentStatus = status;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.status === status));
      loadBoard();
    }

    const STATUS_LABELS = {
      new:'новая', picking:'сборка', ready_to_ship:'готова', shipping:'отгружается',
      in_transit:'в пути', done:'выполнена', cancelled:'отменена',
    };
    const STATUS_PILL = {
      new:'pill-gray', picking:'pill-blue', ready_to_ship:'pill-green',
      shipping:'pill-yellow', in_transit:'pill-yellow', done:'pill-green', cancelled:'pill-red',
    };

    function applyDateFilter() { loadBoard(); }
    function resetDateFilter() {
      UI.setVal('#f-shipped-from', '');
      UI.setVal('#f-shipped-to', '');
      loadBoard();
    }

    async function loadBoard() {
      try {
        const params = { limit: 100 };
        if (currentStatus) params.status = currentStatus;
        const shippedFrom = UI.val('#f-shipped-from');
        const shippedTo   = UI.val('#f-shipped-to');
        if (shippedFrom) params.shipped_from = shippedFrom;
        if (shippedTo)   params.shipped_to   = shippedTo;
        const res = await window.API.shipping.board(params);
        shipments = res.shipments || [];
        const list = document.getElementById('ship-list');
        if (!shipments.length) {
          list.innerHTML = `<div class="empty-state"><div class="icon">📭</div>Нет отгрузок</div>`;
          return;
        }
        list.innerHTML = shipments.map((s, idx) => {
          // Факт отгрузки: когда и кто — заполняется только после реального
          // подтверждения (shipping.confirm), для ещё не отгруженных пусто.
          const shippedLine = s.shipped_at
            ? `<div class="sub">🚚 ${UI.fmtDateTime(s.shipped_at)}${s.shipper_name ? ' · '+UI.escHtml(s.shipper_name) : ''}</div>`
            : '';
          return `
          <div class="list-row ship-row" onclick="openShipment(${idx})">
            <div class="main">
              <div class="title">${UI.escHtml(s.external_id)}</div>
              <div class="sub">${UI.escHtml(s.client_name||'')} · ${UI.escHtml(s.warehouse_name||'')} · сборка ${s.tasks_done||0}/${s.tasks_total||0}</div>
              ${shippedLine}
            </div>
            <span class="pill ${STATUS_PILL[s.status]||'pill-gray'}">${STATUS_LABELS[s.status]||s.status}</span>
          </div>
        `;
        }).join('');
      } catch (e) { UI.notify.err(e.message); }
    }

    function openShipment(idx) {
      openShipmentByCode(shipments[idx].external_id);
    }

    // Позволяет открыть детальную карточку отгрузки напрямую по коду — не
    // только кликом по строке в собственном списке этой страницы, но и
    // переходом с другого экрана (Диспетчерская, Табло — см. ?code= в URL
    // ниже), не важно на каком этапе сейчас отгрузка (сборка/упаковка/отгрузка).
    async function openShipmentByCode(code) {
      try {
        const res = await window.API.shipping.details(code);
        currentShipment = res.shipment;
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('detail-view').style.display = 'block';
        document.getElementById('d-code').textContent = currentShipment.external_id;
        document.getElementById('d-status').textContent = STATUS_LABELS[currentShipment.status] || currentShipment.status;
        document.getElementById('d-client').textContent = currentShipment.client_name || '—';
        const shippedBadge = document.getElementById('d-shipped-badge');
        if (currentShipment.shipped_at) {
          shippedBadge.style.display = 'block';
          document.getElementById('d-shipped').textContent =
            UI.fmtDateTime(currentShipment.shipped_at) + (currentShipment.shipper_name ? ' · ' + currentShipment.shipper_name : '');
        } else {
          shippedBadge.style.display = 'none';
        }
        const totalPlan = (res.lines||[]).reduce((a,l)=>a+Number(l.qty||0),0);
        const totalPicked = (res.lines||[]).reduce((a,l)=>a+Number(l.qty_picked||0),0);
        document.getElementById('d-picked').textContent = `${totalPicked}/${totalPlan}`;
        currentLines = res.lines || [];
        UI.renderTable('#lines-body', currentLines, (l, idx) => `
          <tr>
            <td>${UI.escHtml(l.item_name || l.barcode)}</td>
            <td>${UI.fmtQty(l.qty)}</td>
            <td>${UI.fmtQty(l.qty_picked)}</td>
            <td>${UI.fmtQty(l.qty_packed)}</td>
            <td>${l.preview_url ? `<a href="#" onclick="openLinePhoto(${idx});return false;">Открыть</a>` : '—'}</td>
            <td>${l.wb_sticker ? `<a href="#" onclick="openLineSticker(${idx});return false;">Открыть</a>` : '—'}</td>
            <td>${
              l.picking_status === 'skipped'
                ? (canRequeue
                    ? `<button class="btn-sm btn-back" onclick="requeueLine(${idx});return false;">↩ Вернуть в сборку</button>`
                    : `<span class="pill pill-red">пропущено</span>`)
                : '—'
            }</td>
          </tr>
        `);
        document.getElementById('qr-result').style.display = 'none';
        document.getElementById('confirm-status').textContent = '';
        renderWbQrCard();
        const alreadyShipped = ['in_transit','done'].includes(currentShipment.status);
        // Если локально уже "Отгружена", но ВБ так и не был уведомлён (старый баг —
        // deliverSupply вообще не вызывался) — не прячем карточку, а даём
        // отгрузчику повторно отсканировать код, чтобы попытаться ещё раз.
        const needsWbRetry = currentShipment.status === 'in_transit' && !currentShipment.wb_delivered_at;
        document.getElementById('confirm-card').style.display = (alreadyShipped && !needsWbRetry) ? 'none' : 'block';
        document.getElementById('confirm-hint').textContent = needsWbRetry
          ? 'Отгружена локально, но ВБ ещё не подтвердил статус. Отсканируйте код поставки ещё раз, чтобы повторить попытку.'
          : 'Отсканируйте QR/штрихкод поставки (со стикера коробки/акта передачи)';
        setTimeout(() => document.getElementById('scan-code')?.focus(), 150);
      } catch (e) { UI.notify.err(e.message); }
    }

    function openLinePhoto(idx) {
      const l = currentLines[idx];
      if (!l?.preview_url) return;
      window.open(l.preview_url, '_blank');
    }

    async function requeueLine(idx) {
      const l = currentLines[idx];
      if (!l?.task_id) { UI.notify.err('Не найден id задания сборки для этой строки'); return; }
      try {
        await window.API.picking.requeue(l.task_id);
        UI.notify.ok(`Возвращено в сборку: ${l.item_name || l.barcode}`);
        await openShipmentByCode(currentShipment.external_id);
      } catch (e) { UI.notify.err(e.message); }
    }

    function openLineSticker(idx) {
      const l = currentLines[idx];
      if (!l?.wb_sticker) return;
      const w = window.open('', '_blank');
      w.document.write(`<title>Стикер ${UI.escHtml(l.barcode)}</title>
        <body style="margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#fff;gap:12px;">
          <img src="data:image/svg+xml;base64,${l.wb_sticker}" style="max-width:90vw;max-height:80vh;" onload="window.print()"/>
          ${l.wb_sticker_code ? `<div style="font-family:monospace;font-size:14px;color:#333;">${UI.escHtml(l.wb_sticker_code)}</div>` : ''}
        </body>`);
      w.document.close();
    }

    function renderWbQrCard() {
      const card = document.getElementById('wb-qr-card');
      const box  = document.getElementById('wb-qr-box');
      const b64  = currentShipment?.wb_supply_qr_base64;
      if (!b64) { card.style.display = 'none'; box.innerHTML = ''; return; }
      card.style.display = 'block';
      box.innerHTML = `
        <div style="color:#0f172a;font-weight:700;margin-bottom:8px;">${UI.escHtml(currentShipment.external_id)}</div>
        <img src="data:image/svg+xml;base64,${b64}" alt="QR"/>
      `;
    }

    function openWbQr() {
      const b64 = currentShipment?.wb_supply_qr_base64;
      if (!b64) return;
      const w = window.open('', '_blank');
      w.document.write(`<title>QR ${currentShipment.external_id}</title>
        <body style="margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#fff;">
          <img src="data:image/svg+xml;base64,${b64}" style="max-width:90vw;max-height:90vh;"/>
        </body>`);
      w.document.close();
    }

    function printWbQr() {
      const b64 = currentShipment?.wb_supply_qr_base64;
      if (!b64) return;
      const w = window.open('', '_blank');
      w.document.write(`<title>Печать QR ${currentShipment.external_id}</title>
        <body style="margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#fff;">
          <img src="data:image/svg+xml;base64,${b64}" style="max-width:90vw;max-height:90vh;" onload="window.print()"/>
        </body>`);
      w.document.close();
    }

    function backToList() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('list-view').style.display = 'block';
      currentShipment = null;
      // Убираем ?code= из адреса, чтобы обновление страницы не открывало
      // ту же деталь заново после того, как явно вернулись к списку.
      const url = new URL(location.href);
      if (url.searchParams.has('code')) {
        url.searchParams.delete('code');
        history.replaceState(null, '', url.pathname + url.search);
      }
    }

    async function confirmShipment(scannedCode) {
      if (!currentShipment) return;
      const statusEl = document.getElementById('confirm-status');
      try {
        const res = await window.API.shipping.confirm({
          shipment_code: currentShipment.external_id,
          scanned_code: scannedCode,
        });
        UI.notify.ok(res.alreadyShipped ? 'Уже была отгружена ранее' : `Отгружено! Всего: ${res.totalShipped ?? '—'} шт.`);
        statusEl.textContent = '✅ Подтверждено';
        if (res.wbDelivered) {
          statusEl.textContent += ' · ВБ уведомлён';
        } else if (res.wbDeliverError) {
          UI.notify.warn('Локально отгружено, но ВБ не подтвердил статус: ' + res.wbDeliverError + '. В кабинете ВБ поставка может ещё висеть «На сборке» — попробуйте отсканировать код ещё раз чуть позже.');
          statusEl.textContent += ' · ⚠️ ВБ не подтвердил, повторите скан позже';
        }
        if (res.qr_base64) {
          document.getElementById('qr-result').style.display = 'block';
          document.getElementById('qr-result').innerHTML = `
            <div class="qr-box">
              <div style="color:#0f172a;font-weight:700;margin-bottom:8px;">QR поставки WB</div>
              <img src="data:image/svg+xml;base64,${res.qr_base64}" alt="QR"/>
            </div>`;
          currentShipment.wb_supply_qr_base64 = res.qr_base64;
          renderWbQrCard();
        }
        document.getElementById('confirm-card').style.display = 'none';
        await loadBoard();
      } catch (e) {
        UI.notify.err(e.message);
        statusEl.textContent = '❌ ' + e.message;
      }
    }
    UI.onScan('#scan-code', confirmShipment);

    loadBoard();

    // Прямая ссылка на конкретную отгрузку (?code=WB-GI-...) — например с
    // Диспетчерской, где строку отгрузки теперь можно кликнуть.
    const deepLinkCode = new URLSearchParams(location.search).get('code');
    if (deepLinkCode) openShipmentByCode(deepLinkCode);
  </script>
</body>
</html>
