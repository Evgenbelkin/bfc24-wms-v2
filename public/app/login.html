<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>BFC24 WMS v2 — Вход</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:40px 32px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(15,23,42,.08);}
    .logo{text-align:center;margin-bottom:32px;}
    .logo h1{color:#0284c7;font-size:28px;font-weight:800;letter-spacing:-0.5px;}
    .logo p{color:#64748b;font-size:14px;margin-top:4px;}
    label{display:block;color:#334155;font-size:13px;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
    input{width:100%;padding:14px 16px;background:#f1f5f9;border:2px solid #e2e8f0;border-radius:10px;color:#0f172a;font-size:16px;outline:none;transition:border-color .2s;}
    input:focus{border-color:#0284c7;}
    .field{margin-bottom:20px;}
    .btn{width:100%;padding:16px;background:#0284c7;color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;transition:background .2s;margin-top:8px;}
    .btn:hover{background:#0369a1;}
    .btn:disabled{background:#94a3b8;color:#f1f5f9;cursor:not-allowed;}
    .error{color:#dc2626;font-size:14px;text-align:center;margin-top:12px;display:none;}
    .spinner{display:none;text-align:center;color:#0284c7;font-size:14px;margin-top:12px;}
    #version{text-align:center;color:#94a3b8;font-size:12px;margin-top:24px;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>BFC24 WMS</h1>
      <p>Складская система v2</p>
    </div>
    <form id="form">
      <div class="field">
        <label for="username">Логин</label>
        <input id="username" type="text" placeholder="username" autocomplete="username" autocapitalize="none"/>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn" id="btn">Войти</button>
      <div class="error" id="error"></div>
      <div class="spinner" id="spinner">Проверяем данные...</div>
    </form>
    <a href="/site/register.html" style="display:block;text-align:center;margin-top:20px;color:#0284c7;font-size:14px;text-decoration:none;font-weight:600;">Нет аккаунта? Зарегистрироваться</a>
    <div id="version">v2.0.0</div>
  </div>
