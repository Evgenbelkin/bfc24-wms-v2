<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Сдельная ЗП — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .filters-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
    .filters-row select, .filters-row input{flex:1;min-width:120px;padding:12px 14px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;}
    .r-row{cursor:pointer;}
    .r-row:active{opacity:.7;}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
    .modal-card{background:var(--card);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;}
    @media (min-width:560px){ .modal-overlay{align-items:center;} .modal-card{border-radius:16px;} }
    .emp-card{background:var(--card2);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
    .emp-card .emp-head{display:flex;justify-content:space-between;font-weight:600;cursor:pointer;}
    .emp-card .emp-head .arrow{display:inline-block;transition:transform .15s;margin-right:6px;color:var(--muted2);}
    .emp-card.open .emp-head .arrow{transform:rotate(90deg);}
    .emp-card .emp-detail{display:none;margin-top:8px;border-top:1px solid var(--border);padding-top:6px;}
    .emp-card.open .emp-detail{display:block;}
    .emp-card .emp-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted2);padding:2px 0;}
    .grand-total{font-size:18px;font-weight:700;text-align:right;margin-top:10px;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2"/><path d="M3 7v11a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/><path d="M16 13h4v4h-4a2 2 0 0 1 0-4z"/></svg> Сдельная ЗП</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div id="module-disabled" class="card" style="display:none">
    <div class="empty-state">
      <div class="icon"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
      Модуль сдельной ЗП не подключён для вашей компании.<br/>Обратитесь к администратору платформы.
    </div>
  </div>

  <div id="content">
    <div class="tabs">
      <button class="tab active" data-tab="rates"  onclick="switchTab('rates')">Ставки</button>
      <button class="tab" data-tab="report" onclick="switchTab('report')">Отчёт</button>
    </div>

    <!-- ============ Ставки ============ -->
    <div id="tab-rates">
      <div class="card">
        <div class="card-title">Ставки за операцию (<span id="rate-count">0</span>)</div>
        <div id="rate-list"></div>
      </div>
      <button class="btn-big btn-green btn-full" onclick="openRateModal(null)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Новая ставка</button>
    </div>

    <!-- ============ Отчёт ============ -->
    <div id="tab-report" style="display:none">
      <div class="card">
        <div class="card-title">Период</div>
        <div class="filters-row">
          <select id="rep-client"><option value="">Все клиенты</option></select>
        </div>
        <div class="filters-row">
          <input id="rep-from" type="date"/>
          <input id="rep-to" type="date"/>
        </div>
        <button class="btn-big btn-blue btn-full" onclick="loadReport()"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg> Посчитать</button>
      </div>
      <div class="card">
        <div class="card-title">Выработка × ставка по сотрудникам</div>
        <div id="report-list"></div>
        <div class="grand-total" id="report-total"></div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
