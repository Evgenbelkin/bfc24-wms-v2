<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Заполняемость ячеек — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .filters-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
    .filters-row select{flex:1;min-width:140px;padding:12px 14px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;}
    .legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
    .fill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
    .fill-cell{position:relative;border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;color:#fff;min-height:64px;display:flex;flex-direction:column;justify-content:center;}
    .fill-cell.selected{outline:3px solid var(--yellow,#f59e0b);outline-offset:-3px;}
    .fill-cell .sel-check{position:absolute;top:5px;right:5px;width:18px;height:18px;cursor:pointer;accent-color:var(--yellow,#f59e0b);}
    .select-bar{position:sticky;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--border);padding:12px 20px;margin:12px -20px -20px;border-radius:0 0 14px 14px;display:none;align-items:center;gap:10px;flex-wrap:wrap;z-index:50;}
    .select-bar.show{display:flex;}
    .fill-cell .code{font-size:12px;font-weight:700;word-break:break-all;}
    .fill-cell .pct{font-size:15px;font-weight:800;margin-top:2px;}
    .fill-cell .lit{font-size:10px;opacity:.9;margin-top:1px;}
    .fill-empty{background:var(--card2)!important;color:var(--muted)!important;}
    .fill-green{background:var(--green);}
    .fill-blue{background:var(--blue);}
    .fill-red{background:var(--red);}
    .fill-nodata{background:var(--card2);color:var(--muted);}
    .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}
    .summary-cell{background:var(--card2);border-radius:10px;padding:12px;text-align:center;}
    .summary-cell .num{font-size:18px;font-weight:700;}
    .summary-cell .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/locations.html" class="btn-sm btn-back">← Места хранения</a>
    <h1><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Заполняемость</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div class="card">
    <div class="card-title">Фильтры</div>
    <div class="filters-row">
      <select id="f-warehouse" onchange="loadFillReport()"><option value="">Все склады</option></select>
      <select id="f-zone" onchange="renderGrid()"><option value="">Все зоны</option></select>
      <button type="button" class="btn-sm btn-back" id="select-mode-btn" onclick="toggleSelectMode()">☑ Выбрать ячейки</button>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>занято &lt; 20% — много места</span>
      <span><span class="dot" style="background:var(--blue)"></span>20–90% — нормально</span>
      <span><span class="dot" style="background:var(--red)"></span>&gt; 90% — почти забита</span>
      <span><span class="dot" style="background:var(--card2);border:1px solid var(--border)"></span>нет данных об объёме ячейки</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Сводка</div>
    <div class="summary-grid">
      <div class="summary-cell"><div class="num" id="s-total">—</div><div class="lbl">Ячеек</div></div>
      <div class="summary-cell"><div class="num" id="s-green">—</div><div class="lbl">Зелёных</div></div>
      <div class="summary-cell"><div class="num" id="s-blue">—</div><div class="lbl">Синих</div></div>
      <div class="summary-cell"><div class="num" id="s-red">—</div><div class="lbl">Красных</div></div>
      <div class="summary-cell"><div class="num" id="s-nodata">—</div><div class="lbl">Без объёма</div></div>
      <div class="summary-cell"><div class="num" id="s-occupied">—</div><div class="lbl">Занято, л</div></div>
      <div class="summary-cell"><div class="num" id="s-capacity">—</div><div class="lbl">Вместимость, л</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Ячейки (<span id="grid-count">0</span>)</div>
    <div id="fill-grid" class="fill-grid"></div>
    <div id="select-bar" class="select-bar">
      <span style="font-weight:700;">Выбрано: <span id="sel-count">0</span></span>
      <button type="button" class="btn-sm btn-back" onclick="clearSelection()">Снять выбор</button>
      <button type="button" class="btn-sm btn-blue" style="margin-left:auto;" onclick="createInventoryForSelected()">
        <svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;vertical-align:-2px;"><path d="M12 5v14M5 12h14"/></svg>
        Создать проверку по выбранным
      </button>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
