<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Диспетчерская — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
    @media (min-width:600px){ .kpi-grid{grid-template-columns:repeat(4,1fr);} }
    .kpi{background:var(--card);border-radius:14px;padding:16px;text-align:center;}
    .kpi .num{font-size:28px;font-weight:800;}
    .kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:4px;}
    .kpi.warn .num{color:var(--amber);}
    .kpi.danger .num{color:#f87171;}
    .kpi.ok .num{color:var(--green2);}
    .wave-card{border-left:4px solid #334155;}
    .wave-card.idle{border-left-color:#dc2626;background:#2a1414;}
    .wave-card.active{border-left-color:var(--accent);}
    .wave-card.ready{border-left-color:var(--green2);}
    .wave-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
    .wave-title{font-weight:700;font-size:15px;}
    .wave-sub{font-size:12px;color:var(--muted);margin-top:2px;}
    .idle-tag{background:#7f1d1d;color:#fca5a5;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;}
    .mini-progress{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:8px;}
    .mini-progress-fill{height:100%;background:var(--green2);}
    .auto-refresh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
    /* Три мини-шкалы по этапам (Сборка/Упаковка/Отгрузка), как в табло отгрузок v1 */
    .stage-bars{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;}
    .stage-bar{flex:1;min-width:110px;}
    .stage-bar-label{font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;display:flex;justify-content:space-between;}
    .stage-bar-track{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;}
    .stage-bar-fill{height:100%;border-radius:3px;}
    .stage-bar-fill.picking{background:#38bdf8;}
    .stage-bar-fill.packing{background:var(--amber);}
    .stage-bar-fill.shipping{background:var(--green2);}
    .ship-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
    .ship-filter-btn{background:var(--card2);border:none;color:var(--muted);font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;}
    .ship-filter-btn.active{background:var(--accent);color:#fff;}
    .ship-sort-select{margin-left:auto;background:var(--card2);color:var(--text);border:none;border-radius:8px;padding:7px 10px;font-size:12px;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1>📊 Диспетчерская</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div class="kpi-grid" id="kpi-grid"></div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <div class="auto-refresh">🔄 Автообновление каждые 15 сек</div>
    <button class="btn-sm btn-back" onclick="loadAll()">↻ Сейчас</button>
  </div>

  <div class="card">
    <div class="card-title">Волны сборки</div>
    <div id="waves-list"></div>
  </div>

  <div class="card">
    <div class="card-title">Отгрузки в работе</div>
    <div class="ship-filters">
      <button class="ship-filter-btn active" data-filter="all" onclick="setShipFilter('all')">Все</button>
      <button class="ship-filter-btn" data-filter="not_in_wave" onclick="setShipFilter('not_in_wave')">Не в волне</button>
      <button class="ship-filter-btn" data-filter="picking" onclick="setShipFilter('picking')">Сборка</button>
      <button class="ship-filter-btn" data-filter="packing" onclick="setShipFilter('packing')">Упаковка</button>
      <button class="ship-filter-btn" data-filter="ready" onclick="setShipFilter('ready')">Готовы к отгрузке</button>
      <button class="ship-filter-btn" data-filter="shipped" onclick="setShipFilter('shipped')">В пути</button>
      <select class="ship-sort-select" id="ship-sort" onchange="setShipSort(this.value)">
        <option value="new_first">Сначала новые</option>
        <option value="old_first">Сначала старые (зависшие)</option>
        <option value="picking_pct">По % сборки ↑</option>
        <option value="packing_pct">По % упаковки ↑</option>
        <option value="shipping_pct">По % отгрузки ↑</option>
      </select>
    </div>
    <div id="shipments-list"></div>
  </div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
  <script>
    if (!UI.requireAuth()) throw new Error('Not logged in');
    if (!UI.requireRole(['supervisor','tenant_admin'])) {
      window.location.href = '/app/menu.html';
    }

    async function logout() { await window.API.auth.logout(); window.location.href = '/app/login.html'; }

    const IDLE_THRESHOLD_MS = 10 * 60 * 1000; // 10 минут без прогресса по волне — считаем что сборщик простаивает

    const WAVE_STATUS_LABELS = { open:'ожидает', active:'в работе', ready:'собрана', done:'закрыта' };
    const SHIP_STATUS_LABELS = {
      new:'новая', picking:'сборка', ready_to_ship:'готова к отгрузке',
      shipping:'отгружается', in_transit:'в пути', done:'выполнена', cancelled:'отменена',
    };
    const PACKING_STATUS_LABELS = { new:'в очереди на упаковку', in_progress:'упаковывается', done:'упаковано', cancelled:'отменено' };
    const SHIP_STATUS_PILL = {
      new:'pill-gray', picking:'pill-blue', ready_to_ship:'pill-green',
      shipping:'pill-yellow', in_transit:'pill-yellow', done:'pill-green', cancelled:'pill-red',
    };

    function minutesAgo(dateStr) {
      if (!dateStr) return null;
      return Math.floor((Date.now() - new Date(dateStr).getTime()) / 60000);
    }

    async function loadWaves() {
      const [openRes, activeRes, readyRes] = await Promise.all([
        window.API.picking.waves({ status: 'open', limit: 100 }),
        window.API.picking.waves({ status: 'active', limit: 100 }),
        window.API.picking.waves({ status: 'ready', limit: 100 }),
      ]);
      // GET /picking/waves отвечает { ok, waves: [...] }
      return { open: openRes.waves || [], active: activeRes.waves || [], ready: readyRes.waves || [] };
    }

    function renderWaves({ open, active, ready }) {
      const list = document.getElementById('waves-list');
      const rows = [];

      active.forEach(w => {
        const idleMin = minutesAgo(w.updated_at);
        const isIdle = idleMin !== null && idleMin >= (IDLE_THRESHOLD_MS/60000);
        rows.push(`
          <div class="card wave-card ${isIdle ? 'idle' : 'active'}">
            <div class="wave-top">
              <div>
                <div class="wave-title">${UI.escHtml(w.shipment_code)}</div>
                <div class="wave-sub">Сборщик: ${UI.escHtml(w.picker_name || '—')} · ${w.done_count||0}/${w.task_count||0} собрано</div>
              </div>
              ${isIdle ? `<span class="idle-tag">⏸ простой ${idleMin} мин</span>` : `<span class="pill pill-blue">в работе</span>`}
            </div>
            <div class="mini-progress"><div class="mini-progress-fill" style="width:${w.task_count?Math.round(w.done_count/w.task_count*100):0}%"></div></div>
          </div>
        `);
      });

      ready.forEach(w => {
        rows.push(`
          <div class="card wave-card ready">
            <div class="wave-top">
              <div>
                <div class="wave-title">${UI.escHtml(w.shipment_code)}</div>
                <div class="wave-sub">Сборщик: ${UI.escHtml(w.picker_name || '—')} · собрана, ждёт закрытия (короб → ${UI.escHtml(w.buffer_location_code || 'не указано')})</div>
              </div>
              <span class="pill pill-green">готова</span>
            </div>
          </div>
        `);
      });

      if (open.length) {
        rows.push(`
          <div class="card wave-card">
            <div class="wave-top">
              <div>
                <div class="wave-title">В очереди на сборку</div>
                <div class="wave-sub">${open.length} волн(ы) ожидают, когда сборщик возьмёт их в работу</div>
              </div>
              <span class="pill pill-gray">${open.length}</span>
            </div>
          </div>
        `);
      }

      list.innerHTML = rows.join('') || `<div class="empty-state"><div class="icon">😴</div>Нет активных волн сборки</div>`;

      return { activeCount: active.length, idleCount: active.filter(w => { const m = minutesAgo(w.updated_at); return m !== null && m >= IDLE_THRESHOLD_MS/60000; }).length, readyCount: ready.length, openCount: open.length };
    }

    let allShipments = [];      // кэш последней загрузки, с посчитанными % — фильтр/сортировка работают без рефетча
    let shipFilter = 'all';
    let shipSort = 'new_first';

    const STAGE_LABELS = {
      not_in_wave: 'ещё не в волне', picking: 'на сборке', packing: 'на упаковке',
      ready: 'готова к отгрузке', shipped: 'в пути / отгружена',
    };

    function stageOf(pickingPct, packingPct, shippingPct, tasksTotal) {
      if (!tasksTotal) return 'not_in_wave';
      if (pickingPct < 100) return 'picking';
      if (packingPct < 100) return 'packing';
      if (shippingPct < 100) return 'ready';
      return 'shipped';
    }

    function setShipFilter(f) {
      shipFilter = f;
      document.querySelectorAll('.ship-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
      renderShipmentsList();
    }

    function setShipSort(s) {
      shipSort = s;
      renderShipmentsList();
    }

    async function loadShipments() {
      const res = await window.API.shipping.board({ limit: 500 });
      const raw = (res.shipments || []).filter(s => !['done','cancelled'].includes(s.status));

      allShipments = raw.map(s => {
        const qtyPlan = Number(s.qty_plan||0);
        const packedQty = Math.min(Number(s.total_packed_qty||0), qtyPlan || Number(s.total_packed_qty||0));
        const pickingPct = s.tasks_total ? Math.round((s.tasks_done||0) / s.tasks_total * 100) : 0;
        const packingPct = qtyPlan ? Math.round(packedQty / qtyPlan * 100) : 0;
        const shippingPct = ['in_transit','done'].includes(s.status) ? 100 : 0;
        return {
          ...s, pickingPct, packingPct, shippingPct,
          stage: stageOf(pickingPct, packingPct, shippingPct, s.tasks_total),
        };
      });

      return renderShipmentsList();
    }

    function renderShipmentsList() {
      const list = document.getElementById('shipments-list');

      let items = shipFilter === 'all' ? allShipments : allShipments.filter(s => s.stage === shipFilter);

      items = items.slice().sort((a, b) => {
        switch (shipSort) {
          case 'old_first':    return new Date(a.created_at) - new Date(b.created_at);
          case 'picking_pct':  return a.pickingPct - b.pickingPct;
          case 'packing_pct':  return a.packingPct - b.packingPct;
          case 'shipping_pct': return a.shippingPct - b.shippingPct;
          case 'new_first':
          default:             return new Date(b.created_at) - new Date(a.created_at);
        }
      });

      if (!allShipments.length) {
        list.innerHTML = `<div class="empty-state"><div class="icon">📭</div>Нет активных отгрузок</div>`;
      } else if (!items.length) {
        list.innerHTML = `<div class="empty-state"><div class="icon">🔍</div>Ничего не найдено по фильтру «${STAGE_LABELS[shipFilter]||shipFilter}»</div>`;
      } else {
        list.innerHTML = items.map(s => {
          const packingNote = s.packing_status
            ? `${PACKING_STATUS_LABELS[s.packing_status]||s.packing_status}${s.packer_name ? ' · упаковщик: '+UI.escHtml(s.packer_name) : ''}`
            : 'ещё не в очереди на упаковку';

          return `
          <div class="list-row" style="flex-direction:column;align-items:stretch;">
            <div class="main" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
              <div>
                <div class="title">${UI.escHtml(s.external_id)}</div>
                <div class="sub">${UI.escHtml(s.client_name||'')} · ${UI.escHtml(s.warehouse_name||'')} · строк ${s.tasks_total||0}</div>
                <div class="sub">📦 ${packingNote}</div>
              </div>
              <span class="pill ${SHIP_STATUS_PILL[s.status]||'pill-gray'}">${SHIP_STATUS_LABELS[s.status]||s.status}</span>
            </div>
            <div class="stage-bars">
              <div class="stage-bar">
                <div class="stage-bar-label"><span>Сборка</span><span>${s.pickingPct}%</span></div>
                <div class="stage-bar-track"><div class="stage-bar-fill picking" style="width:${s.pickingPct}%"></div></div>
              </div>
              <div class="stage-bar">
                <div class="stage-bar-label"><span>Упаковка</span><span>${s.packingPct}%</span></div>
                <div class="stage-bar-track"><div class="stage-bar-fill packing" style="width:${s.packingPct}%"></div></div>
              </div>
              <div class="stage-bar">
                <div class="stage-bar-label"><span>Отгрузка</span><span>${s.shippingPct}%</span></div>
                <div class="stage-bar-track"><div class="stage-bar-fill shipping" style="width:${s.shippingPct}%"></div></div>
              </div>
            </div>
          </div>
        `;
        }).join('');
      }

      return { total: allShipments.length, readyToShip: allShipments.filter(s=>s.status==='ready_to_ship').length };
    }

    function renderKpis({ activeCount, idleCount, readyCount, openCount }, shipStats) {
      const kpis = [
        { num: activeCount, label:'Волн в работе', cls:'' },
        { num: idleCount,   label:'Простаивают >10 мин', cls: idleCount>0 ? 'danger':'ok' },
        { num: readyCount,  label:'Собраны, ждут упаковки', cls: readyCount>0 ? 'warn':'' },
        { num: shipStats.readyToShip, label:'Готовы к отгрузке', cls: shipStats.readyToShip>0 ? 'ok':'' },
      ];
      document.getElementById('kpi-grid').innerHTML = kpis.map(k => `
        <div class="kpi ${k.cls}"><div class="num">${k.num}</div><div class="label">${k.label}</div></div>
      `).join('');
    }

    async function loadAll() {
      try {
        const [waveStats, shipStats] = await Promise.all([
          loadWaves().then(renderWaves),
          loadShipments(),
        ]);
        renderKpis(waveStats, shipStats);
      } catch (e) { UI.notify.err(e.message); }
    }

    loadAll();
    setInterval(loadAll, 15000);
  </script>
</body>
</html>
