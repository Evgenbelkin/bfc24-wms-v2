<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Перемещение — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .qty-row{display:flex;align-items:center;gap:10px;}
    .qty-btn{width:52px;height:52px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:22px;font-weight:700;cursor:pointer;}
    .qty-val{flex:1;text-align:center;font-size:32px;font-weight:800;color:var(--green2);border:2px solid var(--border);border-radius:10px;background:var(--card2);width:100%;padding:6px 4px;-moz-appearance:textfield;font-family:inherit;}
    .qty-val::-webkit-outer-spin-button,.qty-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
    .qty-val:focus{outline:none;border-color:var(--accent);}
    .content-row{cursor:pointer;}
    .content-row:active{opacity:.7;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><path d="M17 3h4v4"/><path d="M21 3l-6.6 6.6"/><path d="M3 21l6-6"/><path d="M3 7h3.5L15 20.5h6"/><path d="M3 3h3.5L11 9"/><path d="M17 21h4v-4"/></svg> Перемещение</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div class="card">
    <div class="card-title">Клиент</div>
    <select id="client-select" class="field" style="width:100%;padding:12px 14px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;">
      <option value="">Загрузка...</option>
    </select>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="move" onclick="switchTab('move')">Переместить</button>
    <button class="tab" data-tab="history" onclick="switchTab('history')">История</button>
  </div>

  <div id="tab-move">
    <div class="card">
      <div class="card-title">Откуда</div>
      <div class="scan-row">
        <input id="from-location" class="scan-input" placeholder="Код ячейки" inputmode="none" autocomplete="off"/>
        <button type="button" class="scan-camera-btn" onclick="UI.scanInto('#from-location','Скан ячейки-источника')"><svg class="i" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
      </div>
      <div id="from-content" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <div class="card-title">Товар</div>
      <div class="scan-row">
        <input id="move-barcode" class="scan-input" placeholder="Штрихкод товара" inputmode="none" autocomplete="off"/>
        <button type="button" class="scan-camera-btn" onclick="UI.scanInto('#move-barcode','Скан товара')"><svg class="i" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
      </div>
      <div class="refresh-note" id="barcode-note"></div>
    </div>

    <div class="card">
      <div class="card-title">Количество</div>
      <div class="qty-row">
        <button class="qty-btn" onclick="stepQty(-1)">−</button>
        <input type="number" class="qty-val" id="qty-val" value="1" min="1" step="1" inputmode="numeric" onchange="setQty(this.value)" onfocus="this.select()"/>
        <button class="qty-btn" onclick="stepQty(1)">+</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Куда</div>
      <div class="scan-row">
        <input id="to-location" class="scan-input" placeholder="Код ячейки" inputmode="none" autocomplete="off"/>
        <button type="button" class="scan-camera-btn" onclick="UI.scanInto('#to-location','Скан ячейки-назначения')"><svg class="i" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
      </div>
    </div>

    <button class="btn-big btn-green btn-full" onclick="submitMove()"><svg class="i" viewBox="0 0 24 24"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14.01l-3-3"/></svg> Переместить</button>
    <div id="move-status" class="refresh-note"></div>
  </div>

  <div id="tab-history" style="display:none">
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Когда</th><th>Товар</th><th>Кол-во</th><th>Откуда</th><th>Куда</th><th>Кто</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>
    <button class="btn-sm btn-back" onclick="loadHistory()">↻ Обновить</button>
  </div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/shared/scanner.js"></script>
