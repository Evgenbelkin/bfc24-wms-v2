<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Справочник товаров — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .filters-row{display:flex;gap:8px;margin-bottom:10px;}
    .filters-row select, .filters-row input{flex:1;padding:12px 14px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;}
    .item-row{cursor:pointer;}
    .item-row:active{opacity:.7;}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
    .modal-card{background:var(--card);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
    @media (min-width:560px){ .modal-overlay{align-items:center;} .modal-card{border-radius:16px;} }
    .field-row2{display:flex;gap:10px;}
    .field-row2 .field{flex:1;}
    .scan-row{display:flex;gap:8px;}
    .scan-input{flex:1;width:100%;padding:16px;background:var(--card2);border:3px solid var(--border);border-radius:12px;color:var(--text);font-size:17px;outline:none;}
    .scan-camera-btn{padding:0 18px;border:1px solid var(--border);border-radius:12px;background:var(--card2);color:var(--accent);font-size:22px;cursor:pointer;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><path d="M20 12.4 12.6 20a2 2 0 0 1-2.8 0l-6.8-6.8a2 2 0 0 1 0-2.8L10.6 3H20v9.4z"/><circle cx="15.5" cy="7.5" r="1.4"/></svg> Справочник товаров</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div class="card" id="pending-override-card" style="display:none;border:2px solid var(--red);">
    <div class="card-title" style="color:var(--red);">Требует ручной привязки КИЗ в WB (<span id="pending-override-count">0</span>)</div>
    <div class="refresh-note" style="margin-bottom:8px;">Эти единицы упакованы без отправки кода в WB (обход супервайзера) — привяжите код к заказу вручную в кабинете WB.</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Товар</th><th>Код</th><th>Когда</th><th>Кто провёл</th><th>Причина</th></tr></thead>
        <tbody id="pending-override-body"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Клиент</div>
    <select id="f-client" style="width:100%;padding:12px 14px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;">
      <option value="">Все клиенты</option>
    </select>
  </div>

  <div class="card">
    <div class="card-title">Поиск</div>
    <div class="scan-row">
      <input id="f-search" class="scan-input" placeholder="Штрихкод, название или артикул" inputmode="none" autocomplete="off"/>
      <button type="button" class="scan-camera-btn" onclick="UI.scanInto('#f-search','Скан товара')"><svg class="i" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
    </div>
    <button class="btn-big btn-blue btn-full" style="margin-top:10px;" onclick="loadItems()"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg> Показать</button>
  </div>

  <div class="card" id="select-bar" style="display:none;position:sticky;top:0;z-index:10;">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="select-all-cb" onchange="toggleSelectAll(this.checked)"/> Выбрать все на странице</label>
      <span style="font-size:13px;color:var(--muted);">Выбрано: <b id="selected-count">0</b></span>
      <button class="btn-sm btn-blue" style="margin-left:auto;" onclick="openBulkMarkingModal()"><svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Маркировка для выбранных</button>
      <button class="btn-sm btn-red" onclick="deleteSelectedItems()"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg> Удалить выбранные</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Товары (<span id="item-count">0</span> из <span id="item-total">0</span>)</div>
    <div id="item-list"></div>
    <button class="btn-sm btn-back" style="margin-top:10px;" onclick="loadMore()">↓ Ещё</button>
  </div>

  <button class="btn-big btn-green btn-full" id="add-btn" style="display:none" onclick="openModal(null)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Новый товар</button>

  <div id="modal-root"></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/shared/scanner.js"></script>
