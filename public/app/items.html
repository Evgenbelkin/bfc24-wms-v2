<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Справочник товаров — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .filters-row{display:flex;gap:8px;margin-bottom:10px;}
    .filters-row select, .filters-row input{flex:1;padding:12px 14px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;}
    .item-row{cursor:pointer;}
    .item-row:active{opacity:.7;}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
    .modal-card{background:var(--card);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
    @media (min-width:560px){ .modal-overlay{align-items:center;} .modal-card{border-radius:16px;} }
    .field-row2{display:flex;gap:10px;}
    .field-row2 .field{flex:1;}
    .scan-row{display:flex;gap:8px;}
    .scan-input{flex:1;width:100%;padding:16px;background:var(--card2);border:3px solid var(--border);border-radius:12px;color:var(--text);font-size:17px;outline:none;}
    .scan-camera-btn{padding:0 18px;border:1px solid var(--border);border-radius:12px;background:var(--card2);color:var(--accent);font-size:22px;cursor:pointer;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><path d="M20 12.4 12.6 20a2 2 0 0 1-2.8 0l-6.8-6.8a2 2 0 0 1 0-2.8L10.6 3H20v9.4z"/><circle cx="15.5" cy="7.5" r="1.4"/></svg> Справочник товаров</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div class="card" id="pending-override-card" style="display:none;border:2px solid var(--red);">
    <div class="card-title" style="color:var(--red);">Требует ручной привязки КИЗ в WB (<span id="pending-override-count">0</span>)</div>
    <div class="refresh-note" style="margin-bottom:8px;">Эти единицы упакованы без отправки кода в WB (обход супервайзера) — привяжите код к заказу вручную в кабинете WB.</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Товар</th><th>Код</th><th>Когда</th><th>Кто провёл</th><th>Причина</th></tr></thead>
        <tbody id="pending-override-body"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Клиент</div>
    <select id="f-client" style="width:100%;padding:12px 14px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;">
      <option value="">Все клиенты</option>
    </select>
  </div>

  <div class="card">
    <div class="card-title">Поиск</div>
    <div class="scan-row">
      <input id="f-search" class="scan-input" placeholder="Штрихкод, название или артикул" inputmode="none" autocomplete="off"/>
      <button type="button" class="scan-camera-btn" onclick="UI.scanInto('#f-search','Скан товара')"><svg class="i" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
    </div>
    <button class="btn-big btn-blue btn-full" style="margin-top:10px;" onclick="loadItems()"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg> Показать</button>
  </div>

  <div class="card" id="select-bar" style="display:none;position:sticky;top:0;z-index:10;">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="select-all-cb" onchange="toggleSelectAll(this.checked)"/> Выбрать все на странице</label>
      <span style="font-size:13px;color:var(--muted);">Выбрано: <b id="selected-count">0</b></span>
      <button class="btn-sm btn-blue" style="margin-left:auto;" onclick="openBulkMarkingModal()"><svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Маркировка для выбранных</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Товары (<span id="item-count">0</span> из <span id="item-total">0</span>)</div>
    <div id="item-list"></div>
    <button class="btn-sm btn-back" style="margin-top:10px;" onclick="loadMore()">↓ Ещё</button>
  </div>

  <button class="btn-big btn-green btn-full" id="add-btn" style="display:none" onclick="openModal(null)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Новый товар</button>

  <div id="modal-root"></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/shared/scanner.js"></script>
  <script>
    if (!UI.requireAuth()) throw new Error('Not logged in');
    if (!UI.requireRole(['supervisor','tenant_admin','receiver','picker','packer'])) {
      window.location.href = '/app/menu.html';
    }

    const user = window.API.getUser();
    const canEdit = user?.role === 'tenant_admin' || user?.role === 'supervisor';
    if (canEdit) document.getElementById('add-btn').style.display = 'block';

    async function logout() { await window.API.auth.logout(); window.location.href = '/app/login.html'; }

    const UNITS = ['шт','л','кг','м','компл','пара','упак'];

    let clientsList = [];
    let itemOffset = 0;
    const PAGE_SIZE = 100;
    let itemCache = [];
    const selectedItemIds = new Set();

    function onItemCheck(id, checked) {
      if (checked) selectedItemIds.add(id); else selectedItemIds.delete(id);
      updateSelectBar();
    }
    function toggleSelectAll(checked) {
      document.querySelectorAll('.item-cb').forEach(cb => {
        const id = Number(cb.dataset.id);
        cb.checked = checked;
        if (checked) selectedItemIds.add(id); else selectedItemIds.delete(id);
      });
      updateSelectBar();
    }
    function updateSelectBar() {
      document.getElementById('selected-count').textContent = selectedItemIds.size;
      document.getElementById('select-bar').style.display = canEdit ? 'block' : 'none';
      const allOnPage = itemCache.length > 0 && itemCache.every(it => selectedItemIds.has(it.id));
      const allCb = document.getElementById('select-all-cb');
      if (allCb) allCb.checked = allOnPage;
    }

    function openBulkMarkingModal() {
      if (!selectedItemIds.size) { UI.notify.err('Отметьте хотя бы один товар'); return; }
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
          <div class="modal-card">
            <div class="card-title">Маркировка "Честный знак" для ${selectedItemIds.size} товар(ов)</div>
            <div class="field">
              <label style="display:inline;">Требует маркировки</label>
              <input type="checkbox" id="bm-required" checked onchange="document.getElementById('bm-mode-wrap').style.display=this.checked?'block':'none'"/>
            </div>
            <div id="bm-mode-wrap">
              <div class="field">
                <label>Кто маркирует товар</label>
                <select id="bm-mode">
                  <option value="print">Мы (ФФ) печатаем код из своего пула</option>
                  <option value="scan">Клиент уже клеит DataMatrix на производстве — мы только сканируем</option>
                </select>
              </div>
            </div>
            <p style="font-size:12px;color:var(--muted);margin-top:6px;">
              Применится сразу ко всем выбранным товарам, текущие настройки перезапишутся.
              Загруженные ранее коды маркировки (если были) не удаляются.
            </p>
            <div class="btn-row" style="margin-top:14px;">
              <button class="btn-big btn-green" onclick="submitBulkMarking()">Применить к ${selectedItemIds.size}</button>
              <button class="btn-big btn-yellow" onclick="closeModal()">Отмена</button>
            </div>
          </div>
        </div>
      `;
    }

    async function submitBulkMarking() {
      const required = document.getElementById('bm-required').checked;
      const data = { requires_marking: required };
      if (required) data.marking_mode = UI.val('#bm-mode') || 'print';
      try {
        const res = await window.API.marking.bulkUpdateSettings(Array.from(selectedItemIds), data);
        UI.notify.ok(`Обновлено товаров: ${res.updated}`);
        closeModal();
        selectedItemIds.clear();
        await loadItems();
      } catch (e) { UI.notify.err(e.message); }
    }

    async function loadClients() {
      try {
        const res = await window.API.clients.short();
        clientsList = res.clients || [];
        UI.populateSelect('#f-client', clientsList, { valueKey:'id', labelKey:'client_name', emptyLabel:'Все клиенты' });
        document.getElementById('f-client').addEventListener('change', () => loadItems());
      } catch (e) { UI.notify.err(e.message); }
    }

    async function loadItems(append=false) {
      try {
        if (!append) itemOffset = 0;
        const params = { limit: PAGE_SIZE, offset: itemOffset };
        const clientId = UI.val('#f-client'); if (clientId) params.client_id = clientId;
        const search = UI.val('#f-search'); if (search) params.search = search;

        const res = await window.API.items.list(params);
        itemCache = append ? itemCache.concat(res.items) : res.items;
        document.getElementById('item-total').textContent = res.total;
        document.getElementById('item-count').textContent = itemCache.length;

        const list = document.getElementById('item-list');
        if (!itemCache.length) {
          list.innerHTML = `<div class="empty-state"><div class="icon"><svg class="i" viewBox="0 0 24 24"><path d="M20 12.4 12.6 20a2 2 0 0 1-2.8 0l-6.8-6.8a2 2 0 0 1 0-2.8L10.6 3H20v9.4z"/><circle cx="15.5" cy="7.5" r="1.4"/></svg></div>Ничего не найдено</div>`;
          return;
        }
        list.innerHTML = itemCache.map((it, idx) => `
          <div class="list-row item-row" style="display:flex;align-items:center;gap:10px;" onclick="openModal(${idx})">
            ${canEdit ? `<input type="checkbox" class="item-cb" data-id="${it.id}" onclick="event.stopPropagation(); onItemCheck(${it.id}, this.checked);" ${selectedItemIds.has(it.id) ? 'checked' : ''}/>` : ''}
            <div class="main" style="flex:1;">
              <div class="title">${UI.escHtml(it.item_name)}</div>
              <div class="sub">${UI.escHtml(it.barcode)} · ${UI.escHtml(it.client_name||'')} ${it.is_active ? '' : '· <span style="color:var(--red)">выключен</span>'}</div>
            </div>
            <div class="badge"><span>Ед.</span><div>${UI.escHtml(it.unit)}</div></div>
          </div>
        `).join('');
        updateSelectBar();
      } catch (e) { UI.notify.err(e.message); }
    }

    function loadMore() { itemOffset += PAGE_SIZE; loadItems(true); }

    UI.onScan('#f-search', (v) => { UI.setVal('#f-search', v); loadItems(); });

    function openModal(idx) {
      const it = idx !== null ? itemCache[idx] : null;
      const clientOptions = clientsList.map(c => `<option value="${c.id}" ${it && it.client_id===c.id ? 'selected':''}>${UI.escHtml(c.client_name)}</option>`).join('');
      const unitOptions = UNITS.map(u => `<option value="${u}" ${it && it.unit===u ? 'selected':''}>${u}</option>`).join('');
      const kitBaseOptions = it
        ? ['<option value="">— не комплект —</option>'].concat(
            itemCache
              .filter(x => x.id !== it.id && x.client_id === it.client_id)
              .map(x => `<option value="${x.id}" ${it.kit_of_item_id===x.id ? 'selected':''}>${UI.escHtml(x.item_name)} (${UI.escHtml(x.barcode)})</option>`)
          ).join('')
        : '';

      document.getElementById('modal-root').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
          <div class="modal-card">
            <div class="card-title">${it ? UI.escHtml(it.item_name) : 'Новый товар'}</div>
            ${!it ? `<div class="field"><label>Клиент</label><select id="m-client">${clientOptions}</select></div>` : ''}
            <div class="field"><label>Штрихкод</label><input id="m-barcode" value="${it ? UI.escHtml(it.barcode) : ''}" ${it?'disabled':''}/></div>
            <div class="field"><label>Название</label><input id="m-name" value="${it ? UI.escHtml(it.item_name) : ''}"/></div>
            <div class="field-row2">
              <div class="field"><label>Артикул</label><input id="m-vendor" value="${it && it.vendor_code ? UI.escHtml(it.vendor_code):''}"/></div>
              <div class="field"><label>Артикул WB</label><input id="m-wbvendor" value="${it && it.wb_vendor_code ? UI.escHtml(it.wb_vendor_code):''}"/></div>
            </div>
            <div class="field-row2">
              <div class="field"><label>Бренд</label><input id="m-brand" value="${it && it.brand ? UI.escHtml(it.brand):''}"/></div>
              <div class="field"><label>Ед. изм.</label><select id="m-unit">${unitOptions}</select></div>
            </div>
            <div class="field-row2">
              <div class="field"><label>Размер</label><input id="m-size" placeholder="128, 42, L..." value="${it && it.size ? UI.escHtml(it.size):''}"/></div>
              <div class="field"></div>
            </div>
            <div class="field-row2">
              <div class="field"><label>Вес, г</label><input id="m-weight" type="number" value="${it && it.weight_grams!=null ? it.weight_grams:''}"/></div>
              <div class="field"><label>Объём, л</label><input id="m-volume" type="number" value="${it && it.volume_liters!=null ? it.volume_liters:''}"/></div>
            </div>
            <div class="field"><label style="display:inline;">Требует упаковки</label> <input type="checkbox" id="m-needspkg" ${it && it.needs_packaging ? 'checked':''}/></div>
            <div class="field"><label style="display:inline;">Активен</label> <input type="checkbox" id="m-active" ${!it || it.is_active ? 'checked':''}/></div>
            <div class="field" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px;">
              <label style="display:inline;">Требует маркировки "Честный знак"</label> <input type="checkbox" id="m-marking" onchange="document.getElementById('marking-trigger-wrap').style.display=this.checked?'block':'none'" ${it && it.requires_marking ? 'checked':''}/>
              <div class="field" id="marking-trigger-wrap" style="display:${it && it.requires_marking ? 'block':'none'};margin-top:6px;">
                <label>Кто маркирует товар</label>
                <select id="m-marking-mode" onchange="
                  document.getElementById('marking-print-wrap').style.display=this.value==='print'?'block':'none';
                  document.getElementById('marking-scan-hint').style.display=this.value==='scan'?'block':'none';
                  document.getElementById('marking-trigger-select-wrap').style.display=this.value==='print'?'block':'none';
                ">
                  <option value="print" ${!it || (it.marking_mode||'print')==='print' ? 'selected':''}>Мы (ФФ) печатаем код из своего пула</option>
                  <option value="scan" ${it && it.marking_mode==='scan' ? 'selected':''}>Клиент уже клеит DataMatrix на производстве — мы только сканируем</option>
                </select>
                <div id="marking-trigger-select-wrap" style="display:${it && it.marking_mode==='scan' ? 'none':'block'};">
                  <label style="margin-top:6px;">Когда фиксировать код</label>
                  <select id="m-marking-trigger">
                    <option value="packing" ${!it || (it.marking_trigger||'packing')==='packing' ? 'selected':''}>Упаковка (вместе со стикером ВБ)</option>
                    <option value="receiving" ${it && it.marking_trigger==='receiving' ? 'selected':''}>Приёмка (вместе со штрихкодом товара)</option>
                  </select>
                </div>
                <p id="marking-scan-hint" style="display:${it && it.marking_mode==='scan' ? 'block':'none'};font-size:12px;color:var(--muted);margin-top:6px;">
                  Для этого режима код сканируется на ОБОИХ этапах всегда (выбор "когда фиксировать" здесь не действует):
                  на приёмке DataMatrix каждой единицы заносится в пул, на упаковке он сверяется с конкретной
                  единицей и автоматически уходит в WB через API — вручную в кабинете WB вводить не нужно.
                </p>
              </div>
              ${it ? `
              <div style="margin-top:10px;font-size:13px;color:var(--muted);" id="marking-summary">Коды: загрузка…</div>
              <div style="margin-top:4px;">
                <a href="javascript:void(0)" style="font-size:12px;color:var(--blue);" onclick="toggleMarkingCodesList(${it.id})">Показать коды пула ▾</a>
              </div>
              <div id="marking-codes-list" style="display:none;margin-top:6px;max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;"></div>
              <div id="marking-print-wrap" style="display:${!it.marking_mode || it.marking_mode==='print' ? 'block':'none'};">
                <div class="field-row2" style="margin-top:6px;">
                  <textarea id="m-marking-codes-text" placeholder="Коды маркировки, по одному на строку" rows="3" style="flex:1;padding:10px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;"></textarea>
                </div>
                <button class="btn-big btn-blue btn-full" style="margin-top:6px;" onclick="importMarkingCodes(${idx})">Загрузить коды в пул</button>
              </div>
              ` : ''}
            </div>
            ${it ? `
            <div class="field" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px;">
              <label>Печать этикетки (штрихкод + название)</label>
              <div class="field-row2">
                <input id="m-print-copies" type="number" min="1" max="200" value="1" style="max-width:90px;"/>
                <button class="btn-big btn-blue" style="flex:1;" onclick="printItemLabel(${idx})"><svg class="i" viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><rect x="6" y="14" width="12" height="8"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/></svg> Напечатать</button>
              </div>
            </div>
            <div class="field" style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px;">
              <label>Комплект (например: разные фасовки одного товара на WB)</label>
              <div class="field-row2">
                <div class="field"><label>Собран из</label><select id="m-kit-base">${kitBaseOptions}</select></div>
                <div class="field"><label>Штук в комплекте</label><input id="m-kit-mult" type="number" min="1" value="${it.kit_multiplier || 1}"/></div>
              </div>
              ${it.kit_of_item_id ? `
              <p style="font-size:12px;color:var(--muted);margin:6px 0 8px;">
                Комплект из ${it.kit_multiplier} шт. товара «${UI.escHtml(it.kit_of_item_name||'')}» (${UI.escHtml(it.kit_of_barcode||'')})
              </p>
              <div class="field-row2">
                <input id="m-assemble-qty" type="number" min="1" value="1" placeholder="Кол-во комплектов" style="max-width:140px;"/>
                <input id="m-assemble-loc" placeholder="Код ячейки" style="max-width:140px;"/>
                <button class="btn-big btn-green" style="flex:1;" onclick="assembleKit(${idx})"><svg class="i" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg> Собрать</button>
              </div>` : ''}
            </div>` : ''}
            <div class="btn-row">
              ${canEdit ? `<button class="btn-big btn-green" onclick="saveItem(${idx})"><svg class="i" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg> Сохранить</button>` : ''}
              <button class="btn-big btn-yellow" onclick="closeModal()">Закрыть</button>
            </div>
          </div>
        </div>
      `;
      markingCodesListOpen = false;
      if (it) loadMarkingSummary(it.id);
    }

    async function loadMarkingSummary(itemId) {
      const el = document.getElementById('marking-summary');
      if (!el) return;
      try {
        const res = await window.API.marking.summary(itemId);
        const s = res.summary;
        let txt = `Коды: свободно ${s.available}, использовано ${s.used} (всего ${s.total})`;
        if (s.manual_override > 0) txt += ` · без КИЗ вручную: ${s.manual_override}`;
        el.textContent = txt;
      } catch (e) {
        el.textContent = 'Модуль маркировки не подключен для этого склада';
      }
    }

    const MARKING_STATUS_PILL = {
      available: { label: 'Свободен', color: 'var(--green)' },
      used_sent: { label: 'Использован → отправлен в WB', color: 'var(--blue)' },
      used_override: { label: 'Использован → ручной обход (не отправлен)', color: 'var(--orange, #e08a2b)' },
      used_plain: { label: 'Использован', color: 'var(--muted2)' },
    };
    function markingCodeStatusKey(c) {
      if (c.status === 'available') return 'available';
      if (c.wb_submit_status === 'manual_override') return 'used_override';
      if (c.wb_submit_status === 'sent') return 'used_sent';
      return 'used_plain';
    }
    let markingCodesListOpen = false;
    async function toggleMarkingCodesList(itemId) {
      const box = document.getElementById('marking-codes-list');
      if (!box) return;
      markingCodesListOpen = !markingCodesListOpen;
      box.style.display = markingCodesListOpen ? 'block' : 'none';
      if (!markingCodesListOpen) return;
      box.innerHTML = '<div style="padding:10px;font-size:12px;color:var(--muted);">Загрузка…</div>';
      try {
        const res = await window.API.marking.listCodes(itemId, { limit: 500 });
        const rows = res.codes || [];
        if (!rows.length) {
          box.innerHTML = '<div style="padding:10px;font-size:12px;color:var(--muted);">Кодов пока нет</div>';
          return;
        }
        box.innerHTML = rows.map(c => {
          const p = MARKING_STATUS_PILL[markingCodeStatusKey(c)];
          return `<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);font-size:12px;">
            <span style="width:8px;height:8px;border-radius:50%;background:${p.color};flex:0 0 auto;"></span>
            <span style="font-family:monospace;flex:1;word-break:break-all;">${UI.escHtml(c.code)}</span>
            <span style="color:${p.color};white-space:nowrap;">${p.label}</span>
          </div>`;
        }).join('');
      } catch (e) {
        box.innerHTML = `<div style="padding:10px;font-size:12px;color:var(--red);">${UI.escHtml(e.message)}</div>`;
      }
    }

    async function importMarkingCodes(idx) {
      const it = itemCache[idx];
      const text = UI.val('#m-marking-codes-text');
      if (!text || !text.trim()) { UI.notify.err('Вставьте хотя бы один код'); return; }
      try {
        const res = await window.API.marking.importCodes(it.id, text);
        UI.notify.ok(`Загружено: ${res.imported} шт.${res.duplicates ? ` (дублей пропущено: ${res.duplicates})` : ''}`);
        UI.setVal('#m-marking-codes-text', '');
        await loadMarkingSummary(it.id);
      } catch (e) { UI.notify.err(e.message); }
    }

    async function printItemLabel(idx) {
      const it = itemCache[idx];
      const copies = Math.min(Math.max(Number(UI.val('#m-print-copies')) || 1, 1), 200);
      try {
        const res = await window.API.items.printLabel(it.id, copies);
        UI.notify.ok(`Отправлено на печать: ${res.printed} шт.`);
      } catch (e) { UI.notify.err(e.message); }
    }

    async function assembleKit(idx) {
      const it = itemCache[idx];
      const qty = Number(UI.val('#m-assemble-qty'));
      const locationCode = UI.val('#m-assemble-loc');
      if (!qty || qty < 1) { UI.notify.err('Укажите количество комплектов'); return; }
      if (!locationCode) { UI.notify.err('Укажите код ячейки, где стоит базовый товар'); return; }
      try {
        const res = await window.API.inventory.assembleKit({
          client_id: it.client_id,
          kit_item_id: it.id,
          qty,
          location_code: locationCode,
        });
        UI.notify.ok(`Собрано: ${res.qtyAssembled} шт. комплекта (списано ${res.baseQtyUsed} шт. базового товара)`);
        closeModal();
      } catch (e) { UI.notify.err(e.message); }
    }

    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    async function saveItem(idx) {
      const it = idx !== null ? itemCache[idx] : null;
      const data = {
        item_name: UI.val('#m-name'),
        vendor_code: UI.val('#m-vendor'),
        wb_vendor_code: UI.val('#m-wbvendor'),
        brand: UI.val('#m-brand'),
        unit: UI.val('#m-unit'),
        size: UI.val('#m-size'),
        weight_grams: UI.val('#m-weight') || null,
        volume_liters: UI.val('#m-volume') || null,
        needs_packaging: document.getElementById('m-needspkg').checked,
        is_active: document.getElementById('m-active').checked,
        requires_marking: document.getElementById('m-marking').checked,
        marking_trigger: UI.val('#m-marking-trigger') || 'packing',
        marking_mode: UI.val('#m-marking-mode') || 'print',
      };
      if (it) {
        const kitBase = UI.val('#m-kit-base');
        data.kit_of_item_id = kitBase ? Number(kitBase) : null;
        data.kit_multiplier = Number(UI.val('#m-kit-mult')) || 1;
      }
      try {
        if (it) {
          await window.API.items.update(it.id, data);
          UI.notify.ok('Товар обновлён');
        } else {
          data.barcode = UI.val('#m-barcode');
          data.client_id = UI.val('#m-client');
          if (!data.barcode) { UI.notify.err('Укажите штрихкод'); return; }
          if (!data.item_name) { UI.notify.err('Укажите название'); return; }
          await window.API.items.create(data);
          UI.notify.ok('Товар создан');
        }
        closeModal();
        await loadItems();
      } catch (e) { UI.notify.err(e.message); }
    }

    async function loadPendingOverrides() {
      try {
        const res = await window.API.marking.pendingOverrides({ limit: 100 });
        const rows = res.rows || [];
        const card = document.getElementById('pending-override-card');
        if (!rows.length) { card.style.display = 'none'; return; }
        card.style.display = 'block';
        document.getElementById('pending-override-count').textContent = rows.length;
        document.getElementById('pending-override-body').innerHTML = rows.map(r => `
          <tr>
            <td>${UI.escHtml(r.item_name || '—')}</td>
            <td style="font-family:monospace;">${UI.escHtml(r.code)}</td>
            <td>${UI.fmtDateTime(r.used_at)}</td>
            <td>${UI.escHtml(r.override_by_name || '—')}</td>
            <td>${UI.escHtml(r.wb_override_reason || '—')}</td>
          </tr>
        `).join('');
      } catch (e) { /* модуль marking может быть не подключён - просто не показываем */ }
    }

    (async () => { await loadClients(); await loadItems(); await loadPendingOverrides(); })();
  </script>
</body>
</html>
