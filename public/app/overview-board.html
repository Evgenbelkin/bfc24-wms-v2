<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Табло — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .auto-refresh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}

    .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
    @media (min-width:600px){ .kpi-grid{grid-template-columns:repeat(3,1fr);} }
    .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;}
    .kpi .num{font-size:30px;font-weight:800;}
    .kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:4px;}
    .kpi.warn .num{color:var(--amber);}
    .kpi.danger .num{color:var(--red);}
    .kpi.ok .num{color:var(--green2);}

    .funnel-stage{
      background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:8px;
      border-left:4px solid var(--border); display:flex; align-items:center; gap:16px; flex-wrap:wrap;
      cursor:pointer; transition:transform .1s;
    }
    .funnel-stage:active{transform:scale(.99);}
    .funnel-stage.c-receiving{border-left-color:var(--accent);}
    .funnel-stage.c-placement{border-left-color:#a78bfa;}
    .funnel-stage.c-wave{border-left-color:#e879f9;}
    .funnel-stage.c-picking{border-left-color:#2dd4bf;}
    .funnel-stage.c-packing{border-left-color:var(--amber);}
    .funnel-stage.c-shipping{border-left-color:var(--green2);}

    .funnel-stage-head{flex:0 0 180px;}
    .funnel-stage-icon{font-size:22px;}
    .funnel-stage-title{font-weight:700;font-size:15px;margin-top:2px;}
    .funnel-stage-metrics{display:flex;gap:10px;flex-wrap:wrap;flex:1;}

    .fmetric{background:var(--card2);border-radius:10px;padding:8px 14px;min-width:78px;text-align:center;}
    .fmetric .n{font-size:19px;font-weight:800;}
    .fmetric .l{font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:2px;font-weight:600;}
    .fmetric.warn{background:rgba(245,158,11,.15);}
    .fmetric.warn .n{color:var(--amber);}
    .fmetric.ok{background:rgba(34,197,94,.13);}
    .fmetric.ok .n{color:var(--green2);}

    .funnel-chevron{text-align:center;color:var(--muted);font-size:16px;margin:-2px 0;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1>🧭 Табло</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <div class="auto-refresh">🔄 Автообновление каждые 20 сек</div>
    <button class="btn-sm btn-back" onclick="loadAll()">↻ Сейчас</button>
  </div>

  <div class="kpi-grid" id="kpi-grid"></div>

  <div id="funnel-rows"></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
  <script>
    if (!UI.requireAuth()) throw new Error('Not logged in');
    if (!UI.requireRole(['supervisor','tenant_admin'])) {
      window.location.href = '/app/menu.html';
    }

    async function logout() { await window.API.auth.logout(); window.location.href = '/app/login.html'; }

    function metric(m) {
      return `<div class="fmetric ${m.cls||''}"><div class="n">${m.num}</div><div class="l">${m.label}</div></div>`;
    }

    function stage(colorClass, icon, title, href, items) {
      return `
        <div class="funnel-stage ${colorClass}" onclick="location.href='${href}'">
          <div class="funnel-stage-head">
            <div class="funnel-stage-icon">${icon}</div>
            <div class="funnel-stage-title">${title}</div>
          </div>
          <div class="funnel-stage-metrics">${items.map(metric).join('')}</div>
        </div>
        <div class="funnel-chevron">⌄</div>
      `;
    }

    async function loadAll() {
      try {
        const res = await window.API.overview.funnel();
        const r  = res.receiving   || {};
        const p  = res.placement   || {};
        const w  = res.waveBacklog || {};
        const pk = res.picking     || {};
        const pc = res.packing     || {};
        const sh = res.shipping    || {};

        // Сводка сверху: сколько всего требует внимания прямо сейчас, по всей воронке
        const attention = (p.lines_pending||0) + (w.backlog_orders||0) + (pk.tasks_pending||0) + (pc.tasks_pending||0);
        document.getElementById('kpi-grid').innerHTML = [
          { num: attention,           label:'Требует внимания', cls: attention>0 ? 'warn':'ok' },
          { num: sh.ready_to_ship||0, label:'Готовы к отгрузке', cls: sh.ready_to_ship>0 ? 'ok':'' },
          { num: sh.in_transit||0,    label:'В пути', cls:'' },
        ].map(k => `<div class="kpi ${k.cls}"><div class="num">${k.num}</div><div class="label">${k.label}</div></div>`).join('');

        let html = '';
        html += stage('c-receiving', '📥', 'Приёмка', 'receiving.html?from=overview', [
          { label:'Заявок',    num: r.active_orders||0 },
          { label:'Ожидается', num: r.units_expected||0 },
          { label:'Принято',   num: r.units_received||0, cls:'ok' },
        ]);
        html += stage('c-placement', '🗄️', 'Размещение', 'placement.html?from=overview', [
          { label:'Строк',  num: p.lines_pending||0,  cls: p.lines_pending>0 ? 'warn':'' },
          { label:'Единиц', num: p.units_pending||0,  cls: p.units_pending>0 ? 'warn':'' },
        ]);
        html += stage('c-wave', '🧩', 'Волна', 'wb.html?from=overview', [
          { label:'Без волны', num: w.backlog_orders||0, cls: w.backlog_orders>0 ? 'warn':'ok' },
        ]);
        html += stage('c-picking', '🧺', 'Сборка', 'admin-dashboard.html?from=overview', [
          { label:'Строк ждут', num: pk.tasks_pending||0, cls: pk.tasks_pending>0 ? 'warn':'' },
          { label:'Штук ждут',  num: pk.qty_pending||0,   cls: pk.qty_pending>0 ? 'warn':'' },
          { label:'Собрано',    num: pk.tasks_done||0,    cls:'ok' },
        ]);
        html += stage('c-packing', '📦', 'Упаковка', 'admin-dashboard.html?from=overview', [
          { label:'Ждут',      num: pc.tasks_pending||0, cls: pc.tasks_pending>0 ? 'warn':'' },
          { label:'Упаковано', num: pc.tasks_done||0,    cls:'ok' },
        ]);
        html += stage('c-shipping', '🚚', 'Отгрузка', 'shipping.html?from=overview', [
          { label:'Готовы',     num: sh.ready_to_ship||0, cls: sh.ready_to_ship>0 ? 'ok':'' },
          { label:'В пути',     num: sh.in_transit||0 },
          { label:'Доставлено', num: sh.done_total||0,    cls:'ok' },
        ]);
        // убираем шеврон после последнего этапа
        html = html.replace(/<div class="funnel-chevron">⌄<\/div>\s*$/, '');

        document.getElementById('funnel-rows').innerHTML = html;
      } catch (e) { UI.notify.err(e.message); }
    }

    loadAll();
    setInterval(loadAll, 20000);
  </script>
</body>
</html>
