<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Табло — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .auto-refresh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}

    .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
    @media (min-width:600px){ .kpi-grid{grid-template-columns:repeat(3,1fr);} }
    .kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;}
    .kpi .num{font-size:30px;font-weight:800;}
    .kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:4px;}
    .kpi.warn .num{color:var(--amber);}
    .kpi.danger .num{color:var(--red);}
    .kpi.ok .num{color:var(--green2);}

    .funnel-stage{
      background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:8px;
      border-left:4px solid var(--border); display:flex; align-items:center; gap:16px; flex-wrap:wrap;
      cursor:pointer; transition:transform .1s;
    }
    .funnel-stage:active{transform:scale(.99);}
    .funnel-stage.c-receiving{border-left-color:var(--accent);}
    .funnel-stage.c-placement{border-left-color:#a78bfa;}
    .funnel-stage.c-wave{border-left-color:#e879f9;}
    .funnel-stage.c-picking{border-left-color:#2dd4bf;}
    .funnel-stage.c-packing{border-left-color:var(--amber);}
    .funnel-stage.c-shipping{border-left-color:var(--green2);}

    .funnel-stage-head{flex:0 0 180px;}
    .funnel-stage-icon{font-size:22px;}
    .funnel-stage-title{font-weight:700;font-size:15px;margin-top:2px;}
    .funnel-stage-metrics{display:flex;gap:10px;flex-wrap:wrap;flex:1;}

    .fmetric{background:var(--card2);border-radius:10px;padding:8px 14px;min-width:78px;text-align:center;}
    .fmetric .n{font-size:19px;font-weight:800;}
    .fmetric .l{font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:2px;font-weight:600;}
    .fmetric.warn{background:rgba(245,158,11,.15);}
    .fmetric.warn .n{color:var(--amber);}
    .fmetric.ok{background:rgba(34,197,94,.13);}
    .fmetric.ok .n{color:var(--green2);}

    .funnel-chevron{text-align:center;color:var(--muted);font-size:16px;margin:-2px 0;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16.2 7.8l-2 6.4-6.4 2 2-6.4z"/></svg> Табло</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <div class="auto-refresh"><svg class="i" viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> Автообновление каждые 20 сек</div>
    <button class="btn-sm btn-back" onclick="loadAll()">↻ Сейчас</button>
  </div>

  <div class="kpi-grid" id="kpi-grid"></div>

  <div id="funnel-rows"></div>
