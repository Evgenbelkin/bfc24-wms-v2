<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Места хранения — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .filters-row{display:flex;gap:8px;margin-bottom:10px;}
    .filters-row select, .filters-row input{flex:1;padding:12px 14px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;}
    .loc-row{cursor:pointer;}
    .loc-row:active{opacity:.7;}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
    .modal-card{background:var(--card);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;}
    @media (min-width:560px){ .modal-overlay{align-items:center;} .modal-card{border-radius:16px;} }
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg> Места хранения</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div class="card">
    <div class="card-title">Поиск</div>
    <div class="filters-row">
      <input id="f-search" placeholder="Код ячейки"/>
      <select id="f-type">
        <option value="">Все типы</option>
        <option value="rack">Стеллаж</option>
        <option value="floor">Пол</option>
        <option value="buffer">Буфер</option>
        <option value="receiving">Приёмка</option>
        <option value="shipping">Отгрузка</option>
        <option value="quarantine">Карантин</option>
        <option value="virtual">Виртуальная</option>
      </select>
    </div>
    <button class="btn-big btn-blue btn-full" onclick="loadLocations()"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg> Показать</button>
  </div>

  <div class="card" id="select-bar" style="display:none;position:sticky;top:0;z-index:10;">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="select-all-cb" onchange="toggleSelectAll(this.checked)"/> Выбрать все на странице</label>
      <span style="font-size:13px;color:var(--muted);">Выбрано: <b id="selected-count">0</b></span>
      <button class="btn-sm btn-back" style="margin-left:auto;" onclick="openBulkDimensionsModal()"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h6"/></svg> Задать размеры</button>
      <button class="btn-sm btn-blue" onclick="printSelectedLabels()"><svg class="i" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="1.5"/><path d="M6 14h12v7H6z"/></svg> Печать выбранных</button>
      <button class="btn-sm btn-red" onclick="deleteSelectedLocations()"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg> Удалить выбранные</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Ячейки (<span id="loc-count">0</span> из <span id="loc-total">0</span>)</div>
    <div id="loc-list"></div>
    <button class="btn-sm btn-back" style="margin-top:10px;" onclick="loadMore()">↓ Ещё</button>
  </div>

  <div class="btn-row" id="add-btn" style="display:none">
    <button class="btn-big btn-green" style="flex:1;" onclick="openModal(null)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Новая ячейка</button>
    <button class="btn-big btn-blue" style="flex:1;" onclick="openBulkModal()"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Создать пачкой</button>
  </div>
  <a href="/app/location-fill.html" class="btn-sm btn-back btn-full" style="display:block;text-align:center;margin-top:10px;"><svg class="i" viewBox="0 0 24 24" style="vertical-align:-3px;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Заполняемость ячеек</a>

  <div id="modal-root"></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
  <script>
    if (!UI.requireAuth()) throw new Error('Not logged in');
    if (!UI.requireRole(['supervisor','tenant_admin','receiver','picker','inventory_manager'])) {
      window.location.href = '/app/menu.html';
    }

    const user = window.API.getUser();
    const canEdit = (user && user.role === 'tenant_admin') || (user && user.role === 'supervisor');
    if (canEdit) document.getElementById('add-btn').style.display = 'block';

    async function logout() { await window.API.auth.logout(); window.location.href = '/app/login.html'; }

    const TYPE_LABELS = {
      rack:'Стеллаж', floor:'Пол', buffer:'Буфер',
      receiving:'Приёмка', shipping:'Отгрузка', quarantine:'Карантин', virtual:'Виртуальная',
    };

    let warehouses = [];
    let locOffset = 0;
    const PAGE_SIZE = 100;
    let locCache = [];
    const selectedIds = new Set();

    function onLocCheck(id, checked) {
      if (checked) selectedIds.add(id); else selectedIds.delete(id);
      updateSelectBar();
    }
    function toggleSelectAll(checked) {
      document.querySelectorAll('.loc-cb').forEach(cb => {
        const id = Number(cb.dataset.id);
        cb.checked = checked;
        if (checked) selectedIds.add(id); else selectedIds.delete(id);
      });
      updateSelectBar();
    }
    function updateSelectBar() {
      document.getElementById('selected-count').textContent = selectedIds.size;
      document.getElementById('select-bar').style.display = canEdit ? 'block' : 'none';
      const allOnPage = locCache.length > 0 && locCache.every(l => selectedIds.has(l.id));
      document.getElementById('select-all-cb').checked = allOnPage;
    }

    async function printSelectedLabels() {
      if (!selectedIds.size) { UI.notify.err('Отметьте хотя бы одну ячейку'); return; }
      // Открываем окно СРАЗУ, синхронно по клику (см. printStationSticker в
      // printer-panel.html — та же причина: иначе мобильный браузер молча
      // блокирует всплывающее окно, если открыть его после await).
      const w = window.open('', '_blank');
      if (!w) { UI.notify.err('Браузер заблокировал всплывающее окно — разрешите всплывающие окна для этого сайта'); return; }
      w.document.write('<p style="font-family:sans-serif;text-align:center;padding:40px;">Готовим наклейки…</p>');
      try {
        const res = await window.API.locations.printLabels(Array.from(selectedIds));
        const labels = res.labels || [];
        w.document.open();
        // Каждая наклейка — отдельная страница размером под термоэтикетку
        // (58×40мм), а не сетка на A4: раньше это уходило на обычный принтер
        // листом A4 с несколькими ячейками в ряд, вместо одной наклейки на
        // ленте термопринтера. В диалоге печати браузера нужно выбрать
        // термопринтер и масштаб "Реальный размер" (не "Подгонать по странице").
        w.document.write(`
          <html><head><title>Наклейки ячеек (${labels.length})</title>
          <style>
            @page { size: 58mm 40mm; margin: 0; }
            html,body{margin:0;padding:0;}
            body{font-family:sans-serif;}
            .cell{width:58mm;height:40mm;box-sizing:border-box;padding:2mm;
                  display:flex;align-items:center;justify-content:center;
                  page-break-after:always;break-after:page;}
            .cell:last-child{page-break-after:auto;break-after:auto;}
            .cell svg{width:100%;height:100%;display:block;}
          </style></head><body>
          ${labels.map(l => `<div class="cell">${l.svg}</div>`).join('')}
          <script>window.onload = () => window.print();<\/script>
          </body></html>
        `);
        w.document.close();
      } catch (e) {
        w.document.open();
        w.document.write(`<p style="font-family:sans-serif;color:red;padding:40px;">${UI.escHtml(e.message)}</p>`);
        w.document.close();
      }
    }

    function openBulkDimensionsModal() {
      if (!selectedIds.size) { UI.notify.err('Отметьте хотя бы одну ячейку'); return; }
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
          <div class="modal-card">
            <div class="card-title">Задать размеры (${selectedIds.size} ячеек)</div>
            <div class="field-row3" style="display:flex;gap:8px;">
              <div class="field" style="flex:1;"><label>Длина, см</label><input id="bd-length" type="number" min="0" step="0.1" oninput="updateBulkDimensionsPreview()"/></div>
              <div class="field" style="flex:1;"><label>Ширина, см</label><input id="bd-width" type="number" min="0" step="0.1" oninput="updateBulkDimensionsPreview()"/></div>
              <div class="field" style="flex:1;"><label>Высота, см</label><input id="bd-height" type="number" min="0" step="0.1" oninput="updateBulkDimensionsPreview()"/></div>
            </div>
            <p id="bd-preview" style="font-size:13px;color:var(--muted);margin:6px 0 0;"></p>
            <p style="font-size:12px;color:var(--muted);">Применится ко всем выбранным ячейкам одинаково.</p>
            <div class="btn-row" style="margin-top:14px;">
              <button class="btn-big btn-green" onclick="submitBulkDimensions()">Применить</button>
              <button class="btn-big btn-yellow" onclick="closeModal()">Отмена</button>
            </div>
          </div>
        </div>
      `;
    }

    function updateBulkDimensionsPreview() {
      const el = document.getElementById('bd-preview');
      if (!el) return;
      const l = Number(UI.val('#bd-length')) || 0;
      const w = Number(UI.val('#bd-width')) || 0;
      const h = Number(UI.val('#bd-height')) || 0;
      el.textContent = (l > 0 && w > 0 && h > 0) ? `Вместимость: ≈ ${(l*w*h/1000).toFixed(1)} л на ячейку` : '';
    }

    async function submitBulkDimensions() {
      const data = {
        ids: Array.from(selectedIds),
        length_cm: UI.val('#bd-length') || null,
        width_cm: UI.val('#bd-width') || null,
        height_cm: UI.val('#bd-height') || null,
      };
      try {
        const res = await window.API.locations.bulkDimensions(data);
        UI.notify.ok(`Обновлено ячеек: ${res.updated}`);
        closeModal();
        await loadLocations();
      } catch (e) { UI.notify.err(e.message); }
    }

    function openBulkModal() {
      const whOptions = warehouses.map(w => `<option value="${w.id}">${UI.escHtml(w.warehouse_name)}</option>`).join('');
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
          <div class="modal-card">
            <div class="card-title">Создать ячейки пачкой</div>
            <div class="field"><label>Склад</label><select id="b-warehouse">${whOptions}</select></div>
            <div class="field"><label>Зона/стеллаж (буква)</label><input id="b-zone" placeholder="A" maxlength="10" oninput="this.value=this.value.toUpperCase(); updateBulkPreview();"/></div>
            <div class="field-row2">
              <div class="field"><label>Ряд от</label><input id="b-row-from" type="number" min="1" value="1" oninput="updateBulkPreview()"/></div>
              <div class="field"><label>Ряд до</label><input id="b-row-to" type="number" min="1" value="1" oninput="updateBulkPreview()"/></div>
            </div>
            <div class="field-row2">
              <div class="field"><label>Позиция от</label><input id="b-pos-from" type="number" min="1" value="1" oninput="updateBulkPreview()"/></div>
              <div class="field"><label>Позиция до</label><input id="b-pos-to" type="number" min="1" value="20" oninput="updateBulkPreview()"/></div>
            </div>
            <div class="field"><label>Тип ячейки</label><select id="b-type">${Object.entries(TYPE_LABELS).map(([k,v])=>`<option value="${k}" ${k==='rack'?'selected':''}>${v}</option>`).join('')}</select></div>
            <div class="field-row3" style="display:flex;gap:8px;">
              <div class="field" style="flex:1;"><label>Длина, см</label><input id="b-length" type="number" min="0" step="0.1" oninput="updateBulkPreview()"/></div>
              <div class="field" style="flex:1;"><label>Ширина, см</label><input id="b-width" type="number" min="0" step="0.1" oninput="updateBulkPreview()"/></div>
              <div class="field" style="flex:1;"><label>Высота, см</label><input id="b-height" type="number" min="0" step="0.1" oninput="updateBulkPreview()"/></div>
            </div>
            <p style="font-size:12px;color:var(--muted);margin:0;">Размеры необязательны, но нужны для экрана «Заполняемость ячеек» — применятся ко всем ячейкам этой партии</p>
            <p id="b-preview" style="font-size:13px;color:var(--muted);margin:6px 0 0;"></p>
            <div class="btn-row" style="margin-top:14px;">
              <button class="btn-big btn-green" onclick="submitBulkCreate()">Создать</button>
              <button class="btn-big btn-yellow" onclick="closeModal()">Отмена</button>
            </div>
          </div>
        </div>
      `;
      updateBulkPreview();
    }

    function updateBulkPreview() {
      const el = document.getElementById('b-preview');
      if (!el) return;
      const zone = (UI.val('#b-zone') || '').trim().toUpperCase();
      const rFrom = Number(UI.val('#b-row-from')) || 0;
      const rTo = Number(UI.val('#b-row-to')) || 0;
      const pFrom = Number(UI.val('#b-pos-from')) || 0;
      const pTo = Number(UI.val('#b-pos-to')) || 0;
      if (!zone || rFrom < 1 || rTo < rFrom || pFrom < 1 || pTo < pFrom) {
        el.textContent = 'Заполните диапазоны корректно';
        return;
      }
      const total = (rTo - rFrom + 1) * (pTo - pFrom + 1);
      const pad = (n) => String(n).padStart(2, '0');
      const l = Number(UI.val('#b-length')) || 0;
      const w = Number(UI.val('#b-width')) || 0;
      const h = Number(UI.val('#b-height')) || 0;
      const volumeHint = (l > 0 && w > 0 && h > 0) ? `<br>Вместимость каждой ячейки: ≈ ${(l*w*h/1000).toFixed(1)} л` : '';
      el.innerHTML = `Будет создано (или пропущено, если уже есть): <b>${total}</b> ячеек. ` +
        `Пример: <code>${zone}-${pad(rFrom)}-${pad(pFrom)}</code> … <code>${zone}-${pad(rTo)}-${pad(pTo)}</code>` + volumeHint +
        (total > 2000 ? `<br><span style="color:var(--red)">Слишком много за раз (максимум 2000) — уменьшите диапазон.</span>` : '');
    }

    async function submitBulkCreate() {
      const data = {
        warehouse_id: UI.val('#b-warehouse'),
        zone: UI.val('#b-zone'),
        row_from: UI.val('#b-row-from'),
        row_to: UI.val('#b-row-to'),
        position_from: UI.val('#b-pos-from'),
        position_to: UI.val('#b-pos-to'),
        location_type: UI.val('#b-type'),
        length_cm: UI.val('#b-length') || null,
        width_cm: UI.val('#b-width') || null,
        height_cm: UI.val('#b-height') || null,
      };
      try {
        const res = await window.API.locations.bulkCreate(data);
        UI.notify.ok(`Создано: ${res.created}${res.skipped ? `, уже было: ${res.skipped}` : ''} (всего в диапазоне: ${res.total})`);
        closeModal();
        await loadLocations();
      } catch (e) { UI.notify.err(e.message); }
    }

    async function loadWarehouses() {
      try {
        const res = await window.API.warehouses.list();
        warehouses = res.warehouses || [];
      } catch (e) { UI.notify.err(e.message); }
    }

    async function loadLocations(append=false) {
      try {
        if (!append) locOffset = 0;
        const params = { limit: PAGE_SIZE, offset: locOffset };
        const search = UI.val('#f-search'); if (search) params.search = search;
        const type = UI.val('#f-type'); if (type) params.location_type = type;

        const res = await window.API.locations.list(params);
        locCache = append ? locCache.concat(res.locations) : res.locations;
        document.getElementById('loc-total').textContent = res.total;
        document.getElementById('loc-count').textContent = locCache.length;

        const list = document.getElementById('loc-list');
        if (!locCache.length) {
          list.innerHTML = `<div class="empty-state"><div class="icon"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg></div>Ничего не найдено</div>`;
          return;
        }
        list.innerHTML = locCache.map((l, idx) => `
          <div class="list-row loc-row" style="display:flex;align-items:center;gap:10px;" onclick="openModal(${idx})">
            ${canEdit ? `<input type="checkbox" class="loc-cb" data-id="${l.id}" onclick="event.stopPropagation(); onLocCheck(${l.id}, this.checked);" ${selectedIds.has(l.id) ? 'checked' : ''}/>` : ''}
            <div class="main" style="flex:1;">
              <div class="title">${UI.escHtml(l.location_code)}</div>
              <div class="sub">${UI.escHtml(TYPE_LABELS[l.location_type]||l.location_type)} · ${UI.escHtml(l.warehouse_name)} ${l.is_active ? '' : '· <span style="color:var(--red)">выключена</span>'}</div>
            </div>
            <div class="badge"><span>На руках</span><div>${UI.fmtQty(l.qty_on_hand)}</div></div>
          </div>
        `).join('');
        updateSelectBar();
      } catch (e) { UI.notify.err(e.message); }
    }

    function loadMore() { locOffset += PAGE_SIZE; loadLocations(true); }

    function openModal(idx) {
      const loc = idx !== null ? locCache[idx] : null;
      const readonly = !canEdit;
      const whOptions = warehouses.map(w => `<option value="${w.id}" ${loc && loc.warehouse_id===w.id ? 'selected':''}>${UI.escHtml(w.warehouse_name)}</option>`).join('');
      const typeOptions = Object.entries(TYPE_LABELS).map(([k,v]) => `<option value="${k}" ${loc && loc.location_type===k ? 'selected':''}>${v}</option>`).join('');

      document.getElementById('modal-root').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
          <div class="modal-card">
            <div class="card-title">${loc ? 'Ячейка '+UI.escHtml(loc.location_code) : 'Новая ячейка'}</div>
            <div class="field"><label>Код ячейки</label><input id="m-code" value="${loc ? UI.escHtml(loc.location_code) : ''}" ${loc?'disabled':''} placeholder="A-01-02-3"/></div>
            <div class="field"><label>Склад</label><select id="m-warehouse" ${loc?'disabled':''}>${whOptions}</select></div>
            <div class="field"><label>Тип</label><select id="m-type">${typeOptions}</select></div>
            <div class="field"><label>Описание</label><input id="m-desc" value="${loc && loc.description ? UI.escHtml(loc.description) : ''}"/></div>
            <div class="field"><label>Зона</label><input id="m-zone" value="${loc && loc.zone_code ? UI.escHtml(loc.zone_code) : ''}"/></div>
            <div class="field-row3" style="display:flex;gap:8px;">
              <div class="field" style="flex:1;"><label>Длина, см</label><input id="m-length" type="number" min="0" step="0.1" value="${loc && loc.length_cm!=null ? loc.length_cm : ''}" oninput="updateModalVolumePreview()"/></div>
              <div class="field" style="flex:1;"><label>Ширина, см</label><input id="m-width" type="number" min="0" step="0.1" value="${loc && loc.width_cm!=null ? loc.width_cm : ''}" oninput="updateModalVolumePreview()"/></div>
              <div class="field" style="flex:1;"><label>Высота, см</label><input id="m-height" type="number" min="0" step="0.1" value="${loc && loc.height_cm!=null ? loc.height_cm : ''}" oninput="updateModalVolumePreview()"/></div>
            </div>
            <p id="m-volume-preview" style="font-size:13px;color:var(--muted);margin:2px 0 0;"></p>
            <div class="field"><label style="display:inline;">Активна</label> <input type="checkbox" id="m-active" ${!loc || loc.is_active ? 'checked':''}/></div>
            <div class="field"><label style="display:inline;">Ячейка сборки (pick location)</label> <input type="checkbox" id="m-pick" ${!loc || loc.is_pick_location ? 'checked':''}/></div>
            <div class="btn-row">
              ${canEdit ? `<button class="btn-big btn-green" onclick="saveLocation(${idx})"><svg class="i" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg> Сохранить</button>` : ''}
              <button class="btn-big btn-yellow" onclick="closeModal()">Закрыть</button>
            </div>
            ${canEdit && loc ? `<button class="btn-big btn-red btn-full" style="margin-top:8px;" onclick="deleteLocationFromModal(${idx})"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg> Удалить ячейку</button>` : ''}
          </div>
        </div>
      `;
      updateModalVolumePreview();
    }

    async function deleteLocationFromModal(idx) {
      const loc = locCache[idx];
      if (!loc) return;
      if (!UI.confirm(`Удалить ячейку ${loc.location_code}?`)) return;
      try {
        const res = await window.API.locations.delete(loc.id);
        UI.notify.ok(res.mode === 'soft'
          ? `Ячейка ${res.location_code} деактивирована (есть история движений — полностью удалить нельзя)`
          : `Ячейка ${res.location_code} удалена`);
        closeModal();
        await loadLocations();
      } catch (e) { UI.notify.err(e.message); }
    }

    async function deleteSelectedLocations() {
      if (!selectedIds.size) { UI.notify.err('Отметьте хотя бы одну ячейку'); return; }
      if (!UI.confirm(`Удалить выбранные ячейки (${selectedIds.size} шт.)? Ячейки с товаром пропустятся.`)) return;
      let deleted = 0, deactivated = 0, skipped = 0;
      for (const id of Array.from(selectedIds)) {
        try {
          const res = await window.API.locations.delete(id);
          if (res.mode === 'soft') deactivated++; else deleted++;
          selectedIds.delete(id);
        } catch (e) { skipped++; }
      }
      UI.notify.ok(`Удалено: ${deleted}${deactivated ? `, деактивировано: ${deactivated}` : ''}${skipped ? `, пропущено (есть товар/ошибка): ${skipped}` : ''}`);
      await loadLocations();
    }

    function updateModalVolumePreview() {
      const el = document.getElementById('m-volume-preview');
      if (!el) return;
      const l = Number(UI.val('#m-length')) || 0;
      const w = Number(UI.val('#m-width')) || 0;
      const h = Number(UI.val('#m-height')) || 0;
      el.textContent = (l > 0 && w > 0 && h > 0)
        ? `Вместимость: ≈ ${(l * w * h / 1000).toFixed(1)} л`
        : '';
    }

    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    async function saveLocation(idx) {
      const loc = idx !== null ? locCache[idx] : null;
      const data = {
        location_type: UI.val('#m-type'),
        description: UI.val('#m-desc'),
        zone_code: UI.val('#m-zone'),
        length_cm: UI.val('#m-length') || null,
        width_cm: UI.val('#m-width') || null,
        height_cm: UI.val('#m-height') || null,
        is_active: document.getElementById('m-active').checked,
        is_pick_location: document.getElementById('m-pick').checked,
      };
      try {
        if (loc) {
          await window.API.locations.update(loc.id, data);
          UI.notify.ok('Ячейка обновлена');
        } else {
          data.location_code = UI.val('#m-code');
          data.warehouse_id = UI.val('#m-warehouse');
          if (!data.location_code) { UI.notify.err('Укажите код ячейки'); return; }
          await window.API.locations.create(data);
          UI.notify.ok('Ячейка создана');
        }
        closeModal();
        await loadLocations();
      } catch (e) { UI.notify.err(e.message); }
    }

    (async () => {
      // Переход с экрана "Заполняемость ячеек" по конкретной ячейке — сразу
      // подставляем код в поиск, а не заставляем вводить его заново вручную.
      const params = new URLSearchParams(window.location.search);
      const searchParam = params.get('search');
      if (searchParam) UI.setVal('#f-search', searchParam);
      await loadWarehouses(); await loadLocations();
    })();
  </script>
</body>
</html>
