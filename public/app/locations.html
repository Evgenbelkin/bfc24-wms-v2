<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Места хранения — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .filters-row{display:flex;gap:8px;margin-bottom:10px;}
    .filters-row select, .filters-row input{flex:1;padding:12px 14px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;}
    .loc-row{cursor:pointer;}
    .loc-row:active{opacity:.7;}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
    .modal-card{background:var(--card);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;}
    @media (min-width:560px){ .modal-overlay{align-items:center;} .modal-card{border-radius:16px;} }
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg> Места хранения</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div class="card">
    <div class="card-title">Поиск</div>
    <div class="filters-row">
      <input id="f-search" placeholder="Код ячейки"/>
      <select id="f-type">
        <option value="">Все типы</option>
        <option value="rack">Стеллаж</option>
        <option value="floor">Пол</option>
        <option value="buffer">Буфер</option>
        <option value="receiving">Приёмка</option>
        <option value="shipping">Отгрузка</option>
        <option value="quarantine">Карантин</option>
        <option value="virtual">Виртуальная</option>
      </select>
    </div>
    <button class="btn-big btn-blue btn-full" onclick="loadLocations()"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg> Показать</button>
  </div>

  <div class="card" id="select-bar" style="display:none;position:sticky;top:0;z-index:10;">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;"><input type="checkbox" id="select-all-cb" onchange="toggleSelectAll(this.checked)"/> Выбрать все на странице</label>
      <span style="font-size:13px;color:var(--muted);">Выбрано: <b id="selected-count">0</b></span>
      <button class="btn-sm btn-back" style="margin-left:auto;" onclick="openBulkDimensionsModal()"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h6"/></svg> Задать размеры</button>
      <button class="btn-sm btn-blue" onclick="printSelectedLabels()"><svg class="i" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="1.5"/><path d="M6 14h12v7H6z"/></svg> Печать выбранных</button>
      <button class="btn-sm btn-red" onclick="deleteSelectedLocations()"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg> Удалить выбранные</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Ячейки (<span id="loc-count">0</span> из <span id="loc-total">0</span>)</div>
    <div id="loc-list"></div>
    <button class="btn-sm btn-back" style="margin-top:10px;" onclick="loadMore()">↓ Ещё</button>
  </div>

  <div class="btn-row" id="add-btn" style="display:none">
    <button class="btn-big btn-green" style="flex:1;" onclick="openModal(null)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Новая ячейка</button>
    <button class="btn-big btn-blue" style="flex:1;" onclick="openBulkModal()"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Создать пачкой</button>
  </div>
  <a href="/app/location-fill.html" class="btn-sm btn-back btn-full" style="display:block;text-align:center;margin-top:10px;"><svg class="i" viewBox="0 0 24 24" style="vertical-align:-3px;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Заполняемость ячеек</a>

  <div id="modal-root"></div>
