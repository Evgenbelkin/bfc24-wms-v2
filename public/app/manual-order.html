<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Ручной заказ — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .qty-row{display:flex;align-items:center;gap:10px;}
    .qty-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:20px;font-weight:700;cursor:pointer;}
    .qty-val{flex:0 0 64px;text-align:center;font-size:20px;font-weight:800;color:var(--green2);border:2px solid var(--border);border-radius:10px;background:var(--card2);padding:4px;-moz-appearance:textfield;font-family:inherit;}
    .qty-val::-webkit-outer-spin-button,.qty-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
    .qty-val:focus{outline:none;border-color:var(--accent);}
    .line-name{color:var(--muted);font-size:11px;margin-top:4px;}
    .btn-remove{background:var(--red2);color:var(--red2-text);border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;}
    .result-box{background:var(--card2);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13px;color:var(--muted2);}
    .result-box strong{color:var(--text);}
    .suggest-list{margin-top:8px;max-height:260px;overflow-y:auto;}
    .suggest-row{cursor:pointer;}
    .suggest-row:active{opacity:.7;}
    .or-divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
    .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border);}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg> Ручной заказ</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div class="card">
    <div class="card-title">Клиент</div>
    <select id="client-select" style="width:100%;padding:12px 14px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;">
      <option value="">Загрузка...</option>
    </select>
  </div>

  <div class="card">
    <div class="card-title">Номер заказа / получатель (опционально)</div>
    <input id="external-id" class="scan-input" placeholder="Если не указать — сгенерируем автоматически" style="font-size:15px;padding:12px 14px;"/>
  </div>

  <div class="card">
    <div class="card-title">Добавить товар</div>

    <div class="field" style="margin-bottom:0;">
      <label>Поиск по названию или штрихкоду</label>
      <input id="search-item" placeholder="Начните вводить..." autocomplete="off"/>
    </div>
    <div id="suggest-list" class="suggest-list"></div>

    <div class="or-divider">или отсканируйте</div>

    <div class="scan-row">
      <input id="add-barcode" class="scan-input" placeholder="Штрихкод товара" inputmode="none" autocomplete="off"/>
      <button type="button" class="scan-camera-btn" onclick="UI.scanInto('#add-barcode','Скан товара')"><svg class="i" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
    </div>
    <div id="add-item-name" class="line-name"></div>
    <div class="qty-row" style="margin-top:12px;">
      <button class="qty-btn" onclick="stepAddQty(-1)">−</button>
      <input type="number" class="qty-val" id="add-qty-val" value="1" min="1" step="1" inputmode="numeric" onchange="setAddQty(this.value)" onfocus="this.select()"/>
      <button class="qty-btn" onclick="stepAddQty(1)">+</button>
      <button class="btn-big btn-blue" style="flex:1;" onclick="addLine()"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Добавить в заказ</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Строки заказа (<span id="lines-count">0</span>)</div>
    <div id="lines-list"></div>
  </div>

  <button class="btn-big btn-green btn-full" onclick="createOrder()"><svg class="i" viewBox="0 0 24 24"><path d="M2 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M2 20c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg> Создать волну на сборку</button>
  <div id="create-result"></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/shared/scanner.js"></script>
  <script>
    if (!UI.requireAuth()) throw new Error('Not logged in');
    if (!UI.requireRole(['supervisor','tenant_admin'])) {
      window.location.href = '/app/menu.html';
    }

    async function logout() { await window.API.auth.logout(); window.location.href = '/app/login.html'; }

    let orderLines = []; // { barcode, qty, item_name }
    let addQty = 1;
    let pendingItemName = null;

    function stepAddQty(delta) { addQty = Math.max(1, addQty + delta); document.getElementById('add-qty-val').value = addQty; }
    function setAddQty(val) { addQty = Math.max(1, Math.round(Number(val)) || 1); document.getElementById('add-qty-val').value = addQty; }

    function getClientId() {
      const v = UI.val('#client-select');
      if (!v) { UI.notify.err('Выберите клиента вверху страницы'); return null; }
      return Number(v);
    }

    async function loadClients() {
      const sel = document.getElementById('client-select');
      try {
        const res = await window.API.clients.short();
        const list = res.clients || [];
        if (!list.length) { sel.innerHTML = `<option value="">Нет клиентов — сначала создайте в разделе «Клиенты»</option>`; return; }
        sel.innerHTML = list.map(c => `<option value="${c.id}">${UI.escHtml(c.client_name)}</option>`).join('');
      } catch (e) { sel.innerHTML = `<option value="">Ошибка</option>`; UI.notify.err(e.message); }
    }

    async function lookupBarcode(barcode) {
      const clientId = getClientId();
      const nameBox = document.getElementById('add-item-name');
      pendingItemName = null;
      if (!clientId || !barcode) { nameBox.textContent = ''; return; }
      try {
        const res = await window.API.items.byBarcode(barcode, clientId);
        pendingItemName = (res.item && res.item.item_name) || null;
        nameBox.innerHTML = pendingItemName ? `<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> ${UI.escHtml(pendingItemName)}` : '';
      } catch (e) {
        nameBox.textContent = 'Новый товар — будет создан автоматически при подтверждении заказа';
      }
    }
    UI.onScan('#add-barcode', (v) => { UI.setVal('#add-barcode', v); lookupBarcode(v); });
    document.getElementById('add-barcode').addEventListener('blur', () => lookupBarcode(UI.val('#add-barcode')));

    // ---------- Поиск по справочнику (название/штрихкод) ----------
    let searchTimer = null;

    function selectSuggestion(item) {
      UI.setVal('#add-barcode', item.barcode);
      pendingItemName = item.item_name;
      document.getElementById('add-item-name').innerHTML = `<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> ${UI.escHtml(item.item_name)}`;
      UI.setVal('#search-item', '');
      document.getElementById('suggest-list').innerHTML = '';
    }

    async function runItemSearch(term) {
      const box = document.getElementById('suggest-list');
      const clientId = getClientIdSilent();
      if (!clientId) { box.innerHTML = `<div class="refresh-note">Сначала выберите клиента вверху страницы</div>`; return; }
      if (!term || term.length < 2) { box.innerHTML = ''; return; }
      try {
        const res = await window.API.items.list({ client_id: clientId, search: term, limit: 15 });
        const items = res.items || [];
        if (!items.length) { box.innerHTML = `<div class="refresh-note">Ничего не найдено</div>`; return; }
        box.innerHTML = items.map((it, idx) => `
          <div class="list-row suggest-row" onclick="selectSuggestion(window.__suggestCache[${idx}])">
            <div class="main">
              <div class="title">${UI.escHtml(it.item_name)}</div>
              <div class="sub">${UI.escHtml(it.barcode)}</div>
            </div>
          </div>
        `).join('');
        window.__suggestCache = items;
      } catch (e) { box.innerHTML = `<div class="refresh-note">Ошибка поиска</div>`; }
    }

    function getClientIdSilent() {
      const v = UI.val('#client-select');
      return v ? Number(v) : null;
    }

    document.getElementById('search-item').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      const term = e.target.value.trim();
      searchTimer = setTimeout(() => runItemSearch(term), 300);
    });

    function addLine() {
      const barcode = UI.val('#add-barcode');
      if (!barcode) { UI.notify.err('Отсканируйте или введите штрихкод'); return; }
      const existing = orderLines.find(l => l.barcode === barcode);
      if (existing) {
        existing.qty += addQty;
      } else {
        orderLines.push({ barcode, qty: addQty, item_name: pendingItemName });
      }
      UI.setVal('#add-barcode', '');
      document.getElementById('add-item-name').textContent = '';
      addQty = 1; document.getElementById('add-qty-val').value = 1;
      renderLines();
      document.getElementById('add-barcode').focus();
    }

    function removeLine(idx) {
      orderLines.splice(idx, 1);
      renderLines();
    }

    function renderLines() {
      document.getElementById('lines-count').textContent = orderLines.length;
      const list = document.getElementById('lines-list');
      if (!orderLines.length) {
        list.innerHTML = `<div class="empty-state"><div class="icon"><svg class="i" viewBox="0 0 24 24"><path d="M21 8.5 12 3 3 8.5v7L12 21l9-5.5v-7z"/><path d="M3 8.5 12 13l9-4.5"/><path d="M12 13v8"/></svg></div>Пока пусто — добавьте товары выше</div>`;
        return;
      }
      list.innerHTML = orderLines.map((l, idx) => `
        <div class="list-row">
          <div class="main">
            <div class="title">${UI.escHtml(l.item_name || l.barcode)}</div>
            <div class="sub">${UI.escHtml(l.barcode)}</div>
          </div>
          <div class="badge"><span>Кол-во</span><div>${UI.fmtQty(l.qty)}</div></div>
          <button class="btn-remove" onclick="removeLine(${idx})"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg></button>
        </div>
      `).join('');
    }

    async function createOrder() {
      const clientId = getClientId();
      if (!clientId) return;
      if (!orderLines.length) { UI.notify.err('Добавьте хотя бы один товар'); return; }
      if (!UI.confirm(`Создать волну на сборку из ${orderLines.length} позиций?`)) return;
      try {
        const res = await window.API.picking.manualWave({
          client_id: clientId,
          external_id: UI.val('#external-id') || undefined,
          lines: orderLines.map(l => ({ barcode: l.barcode, qty: l.qty })),
        });
        document.getElementById('create-result').innerHTML = `
          <div class="result-box">
            <svg class="i" viewBox="0 0 24 24"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14.01l-3-3"/></svg> Заказ <strong>${UI.escHtml(res.shipment_code)}</strong> создан.<br/>
            Задач на сборку: <strong>${res.tasks_created}</strong>, товаров всего: <strong>${res.total_qty}</strong><br/>
            Волна уже видна в «Диспетчерской» и на экране «Сборка».
          </div>
        `;
        UI.notify.ok('Волна создана');
        orderLines = [];
        UI.setVal('#external-id', '');
        renderLines();
      } catch (e) { UI.notify.err(e.message); }
    }

    (async () => { await loadClients(); renderLines(); })();
  </script>
</body>
</html>
