<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Ручной заказ — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    .qty-row{display:flex;align-items:center;gap:10px;}
    .qty-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:20px;font-weight:700;cursor:pointer;}
    .qty-val{flex:0 0 64px;text-align:center;font-size:20px;font-weight:800;color:var(--green2);border:2px solid var(--border);border-radius:10px;background:var(--card2);padding:4px;-moz-appearance:textfield;font-family:inherit;}
    .qty-val::-webkit-outer-spin-button,.qty-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
    .qty-val:focus{outline:none;border-color:var(--accent);}
    .line-name{color:var(--muted);font-size:11px;margin-top:4px;}
    .btn-remove{background:var(--red2);color:var(--red2-text);border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;}
    .result-box{background:var(--card2);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13px;color:var(--muted2);}
    .result-box strong{color:var(--text);}
    .suggest-list{margin-top:8px;max-height:260px;overflow-y:auto;}
    .suggest-row{cursor:pointer;}
    .suggest-row:active{opacity:.7;}
    .or-divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
    .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border);}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg> Ручной заказ</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <div class="card">
    <div class="card-title">Клиент</div>
    <select id="client-select" style="width:100%;padding:12px 14px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;">
      <option value="">Загрузка...</option>
    </select>
  </div>

  <div class="card">
    <div class="card-title">Номер заказа / получатель (опционально)</div>
    <input id="external-id" class="scan-input" placeholder="Если не указать — сгенерируем автоматически" style="font-size:15px;padding:12px 14px;"/>
  </div>

  <div class="card">
    <div class="card-title">Добавить товар</div>

    <div class="field" style="margin-bottom:0;">
      <label>Поиск по названию или штрихкоду</label>
      <input id="search-item" placeholder="Начните вводить..." autocomplete="off"/>
    </div>
    <div id="suggest-list" class="suggest-list"></div>

    <div class="or-divider">или отсканируйте</div>

    <div class="scan-row">
      <input id="add-barcode" class="scan-input" placeholder="Штрихкод товара" inputmode="none" autocomplete="off"/>
      <button type="button" class="scan-camera-btn" onclick="UI.scanInto('#add-barcode','Скан товара')"><svg class="i" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
    </div>
    <div id="add-item-name" class="line-name"></div>
    <div class="qty-row" style="margin-top:12px;">
      <button class="qty-btn" onclick="stepAddQty(-1)">−</button>
      <input type="number" class="qty-val" id="add-qty-val" value="1" min="1" step="1" inputmode="numeric" onchange="setAddQty(this.value)" onfocus="this.select()"/>
      <button class="qty-btn" onclick="stepAddQty(1)">+</button>
      <button class="btn-big btn-blue" style="flex:1;" onclick="addLine()"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Добавить в заказ</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Строки заказа (<span id="lines-count">0</span>)</div>
    <div id="lines-list"></div>
  </div>

  <button class="btn-big btn-green btn-full" onclick="createOrder()"><svg class="i" viewBox="0 0 24 24"><path d="M2 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M2 20c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg> Создать волну на сборку</button>
  <div id="create-result"></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/shared/scanner.js"></script>
