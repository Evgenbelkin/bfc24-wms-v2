<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Сборка — BFC24 WMS v2</title>
  <link rel="stylesheet" href="/shared/theme.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;padding:12px;}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .header h1{font-size:20px;font-weight:700;color:#0284c7;}
    .btn-sm{padding:8px 14px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
    .btn-back{background:#ffffff;color:#334155;border:1px solid #e2e8f0;}
    .btn-logout{background:#fee2e2;color:#b91c1c;}
    .card{background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin-bottom:12px;}
    .card-title{font-size:13px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
    .wave-info{display:flex;gap:12px;flex-wrap:wrap;}
    .badge{background:#f1f5f9;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700;}
    .badge span{color:#64748b;font-size:12px;display:block;}
    /* Progress bar */
    .progress-bar{height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden;margin:12px 0;}
    .progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .3s;}
    /* Task card */
    .task-card{background:#f1f5f9;border-radius:14px;padding:20px;}
    .task-barcode{font-size:26px;font-weight:800;color:#0284c7;margin-bottom:4px;word-break:break-all;}
    .task-name{font-size:16px;color:#0f172a;margin-bottom:16px;}
    .task-location{display:flex;align-items:center;gap:10px;background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:16px;}
    .location-icon{font-size:28px;}
    .location-code{font-size:24px;font-weight:800;color:#b45309;}
    .location-label{font-size:12px;color:#64748b;}
    .task-qty{font-size:40px;font-weight:800;color:#16a34a;text-align:center;margin:16px 0;}
    .task-preview{width:80px;height:80px;object-fit:cover;border-radius:8px;float:right;margin-left:12px;}
    /* Scan input */
    .scan-section{margin-top:16px;}
    .scan-label{font-size:14px;color:#334155;margin-bottom:8px;font-weight:600;}
    .scan-input{width:100%;padding:18px;background:#f1f5f9;border:3px solid #e2e8f0;border-radius:12px;color:#0f172a;font-size:18px;outline:none;}
    .scan-input.awaiting-location{border-color:#fbbf24;}
    .scan-input.awaiting-item{border-color:#0284c7;}
    .scan-input:focus{border-color:#0ea5e9;}
    .scan-row{display:flex;gap:8px;}
    .scan-camera-btn{padding:0 18px;border:1px solid #e2e8f0;border-radius:12px;background:#f1f5f9;color:#0284c7;font-size:22px;cursor:pointer;}
    /* Buttons */
    .btn-row{display:flex;gap:10px;margin-top:12px;}
    .btn-big{flex:1;padding:18px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;}
    .btn-green{background:#16a34a;color:#fff;}
    .btn-yellow{background:#d97706;color:#fff;}
    .btn-red{background:#dc2626;color:#fff;}
    .btn-blue{background:#2563eb;color:#fff;}
    /* No wave */
    .no-wave{text-align:center;padding:40px 20px;}
    .no-wave p{color:#64748b;font-size:16px;margin-bottom:20px;}
    /* Step indicator */
    .step-indicator{display:flex;gap:6px;justify-content:center;margin-bottom:16px;}
    .step{width:12px;height:12px;border-radius:50%;background:#e2e8f0;}
    .step.active{background:#0284c7;}
    .step.done{background:#22c55e;}
    #status-msg{text-align:center;color:#64748b;font-size:14px;min-height:20px;margin-top:8px;}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
    .modal-card{background:#ffffff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:520px;box-shadow:0 -8px 30px rgba(15,23,42,.15);}
    @media (min-width:560px){ .modal-overlay{align-items:center;} .modal-card{border-radius:16px;} }
    .modal-card .field-label{font-size:12px;color:#334155;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;}
    .modal-card .hint{font-size:12px;color:#64748b;margin-top:10px;line-height:1.5;}
  </style>
</head>
<body>
  <div class="header">
    <a href="/app/menu.html" class="btn-sm btn-back">← Меню</a>
    <h1><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/></svg> Сборка</h1>
    <button class="btn-sm btn-logout" onclick="logout()">Выход</button>
  </div>

  <!-- Wave info -->
  <div class="card" id="wave-card" style="display:none">
    <div class="card-title">Волна сборки</div>
    <div class="wave-info">
      <div class="badge"><span>Поставка</span><div id="shipment-code">—</div></div>
      <div class="badge"><span>Прогресс</span><div id="wave-progress">0/0</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>

  <!-- No wave -->
  <div class="card no-wave" id="no-wave-card">
    <div style="font-size:48px;margin-bottom:16px;"><svg class="i" viewBox="0 0 24 24"><path d="M21 8.5 12 3 3 8.5v7L12 21l9-5.5v-7z"/><path d="M3 8.5 12 13l9-4.5"/><path d="M12 13v8"/></svg></div>
    <p>Нет активной волны сборки</p>
    <button class="btn-big btn-blue" onclick="takeWave()">Взять волну</button>
  </div>

  <!-- Wave complete, waiting to be closed -->
  <div class="card" id="wave-complete-card" style="display:none">
    <div style="text-align:center;padding:10px 0;">
      <div style="font-size:48px;margin-bottom:12px;"><svg class="i" viewBox="0 0 24 24"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14.01l-3-3"/></svg></div>
      <p style="color:#334155;margin-bottom:20px;">Все товары собраны! Поставьте короб на ячейку МХ и закройте волну.</p>
      <button class="btn-big btn-red" onclick="closeWave()">Закрыть волну</button>
    </div>
  </div>

  <!-- Task card -->
  <div id="task-section" style="display:none">
    <div class="task-card">
      <div class="step-indicator">
        <div class="step" id="step-loc"></div>
        <div class="step" id="step-item"></div>
      </div>

      <div style="overflow:hidden">
        <img id="task-preview" class="task-preview" src="" onerror="this.style.display='none'"/>
        <div class="task-barcode" id="task-barcode">—</div>
        <div class="task-name" id="task-name" style="margin-bottom:2px;">—</div>
        <div id="task-vendor" style="font-size:13px;color:#64748b;margin-bottom:16px;"></div>
      </div>

      <div class="task-location">
        <div class="location-icon"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg></div>
        <div>
          <div class="location-label">Ячейка</div>
          <div class="location-code" id="task-location">—</div>
        </div>
      </div>

      <div class="task-qty" id="task-qty">0</div>

      <div class="scan-section" id="scan-section-main">
        <div class="scan-label" id="scan-label">Отсканируйте ячейку</div>
        <div class="scan-row">
          <input type="text" id="scan-input" class="scan-input awaiting-location"
                 placeholder="Сканировать..." inputmode="none" autocomplete="off"/>
          <button type="button" class="scan-camera-btn" onclick="openCameraScan()"><svg class="i" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
        </div>
      </div>

      <!-- Ввод количества "пачкой" (доработка #6) — появляется вместо scan-section-main
           после скана штрихкода, только если задача переведена сервером в шаг
           await_item_qty (qty>1, товар не маркирован поштучно, включено у тенанта). -->
      <div class="scan-section" id="qty-section" style="display:none">
        <div class="scan-label"><svg class="i" viewBox="0 0 24 24"><path d="M21 8.5 12 3 3 8.5v7L12 21l9-5.5v-7z"/><path d="M3 8.5 12 13l9-4.5"/><path d="M12 13v8"/></svg> Сколько взяли из этой ячейки?</div>
        <div class="scan-row">
          <input type="number" id="qty-input" class="scan-input awaiting-item" inputmode="numeric" min="1" step="1"/>
        </div>
        <div class="hint" id="qty-hint"></div>
        <div class="btn-row">
          <button class="btn-big btn-green" onclick="confirmBatchQty()">Взять</button>
          <button class="btn-sm btn-back" style="padding:0 20px;" onclick="cancelBatchQty()">Назад</button>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-big btn-yellow" onclick="skipTask()">Пропустить</button>
        <button class="btn-big btn-red" onclick="closeWave()">Закрыть волну</button>
      </div>

      <div id="status-msg"></div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/shared/scanner.js"></script>

function updateStepIndicator(scanStep) {
  var locStep = document.getElementById('step-loc');
  var itemStep = document.getElementById('step-item');
  var scanInput = document.getElementById('scan-input');
  var scanLabel = document.getElementById('scan-label');
  if (scanStep === 'await_location') {
    locStep.className = 'step active';
    itemStep.className = 'step';
    scanInput.className = 'scan-input awaiting-location';
    scanLabel.innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg> Отсканируйте ЯЧЕЙКУ';

    scanInput.className = 'scan-input awaiting-item';
    // Для промаркированных товаров (Честный знак, режим "клиент маркирует")
    // можно вместо обычного штрихкода отсканировать сам киз конкретной
    // единицы — система сама определит по нему товар. Подсказываем это
    // явно, чтобы сборщик не гадал, что именно сканировать.
    var marked = currentTask && currentTask.requires_marking && currentTask.marking_mode === 'scan';
    scanLabel.innerHTML = marked ? '<svg class="i" viewBox="0 0 24 24"><path d="M21 8.5 12 3 3 8.5v7L12 21l9-5.5v-7z"/><path d="M3 8.5 12 13l9-4.5"/><path d="M12 13v8"/></svg> Отсканируйте ТОВАР или КИЗ' : '<svg class="i" viewBox="0 0 24 24"><path d="M21 8.5 12 3 3 8.5v7L12 21l9-5.5v-7z"/><path d="M3 8.5 12 13l9-4.5"/><path d="M12 13v8"/></svg> Отсканируйте ТОВАР';
    scanInput.placeholder = marked ? 'Скан штрихкода или киза...' : 'Скан товара...';
  }
}
function renderTask(task) {
  if (!task) {
    document.getElementById('task-section').style.display = 'none';
    return;
  }
  document.getElementById('task-section').style.display = 'block';
  document.getElementById('wave-complete-card').style.display = 'none';
  document.getElementById('no-wave-card').style.display = 'none';
  document.getElementById('wave-card').style.display = 'block';

  // Сброс на случай, если предыдущая задача осталась в состоянии "ввод
  // количества" (доработка #6) — новая/обновлённая задача всегда
  // стартует с обычного скан-поля.
  pendingBatchBarcode = null;
  document.getElementById('qty-section').style.display = 'none';
  document.getElementById('scan-section-main').style.display = 'block';
  currentTask = task;
  document.getElementById('task-barcode').textContent = task.barcode || '—';
  document.getElementById('task-name').textContent = task.item_name || task.barcode || '—';
  document.getElementById('task-vendor').textContent = [task.vendor_code, task.size ? 'разм. ' + task.size : null].filter(Boolean).join(' · ');
  document.getElementById('task-location').textContent = task.location_code || '—';
  document.getElementById('task-qty').textContent = task.qty || 0;
  document.getElementById('shipment-code').textContent = task.shipment_code || '—';
  var preview = document.getElementById('task-preview');
  if (task.preview_url) {
    preview.src = task.preview_url;
    preview.style.display = 'block';
  } else preview.style.display = 'none';
  updateStepIndicator(task.scan_step || 'await_location');
  document.getElementById('status-msg').textContent = '';
  setTimeout(function () {
    return UI.focusNoKeyboard(document.getElementById('scan-input'));
  }, 100);
}
